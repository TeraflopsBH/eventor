        id: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        eventGuestCode: { type: string }
        displayName: { type: string }
        categoryId: { type: [string, 'null'], format: uuid }
        rsvpStatus: { type: string, enum: [pending, invited, confirmed, declined, waitlisted, not_required] }
        participationStatus: { type: string, enum: [active, cancelled, archived] }
        allocationLocator: { type: [string, 'null'] }
        checkinState: { type: string, enum: [not_arrived, checked_in, checked_out, manual_review] }
    EventGuestResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/EventGuest' }
        meta: { $ref: '#/components/schemas/Meta' }
    EventGuestListResponse:
      type: object
      required: [data, page, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/EventGuest' } }
        page: { $ref: '#/components/schemas/Page' }
        meta: { $ref: '#/components/schemas/Meta' }
    JobResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [jobId, status]
          properties:
            jobId: { type: string, format: uuid }
            status: { type: string }
