        page: { $ref: '#/components/schemas/Page' }
        meta: { $ref: '#/components/schemas/Meta' }
    BookingDraftRevisionCreate:
      type: object
      required: [workingPayload, changeReason]
      properties:
        expectedRevision: { type: integer }
        workingPayload: { type: object, additionalProperties: true }
        requestedApprovedDelivered: { type: object, additionalProperties: true }
        changeReason: { type: string, minLength: 3, maxLength: 2000 }
    BookingDraftResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [draftId, revisionId, revisionNumber, lifecycleStatus]
          properties:
            draftId: { type: string, format: uuid }
            revisionId: { type: string, format: uuid }
            revisionNumber: { type: integer }
            lifecycleStatus: { type: string }
            workingPayload: { type: object, additionalProperties: true }
        meta: { $ref: '#/components/schemas/Meta' }