      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptanceToken]
              properties:
                acceptanceToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
              additionalProperties: false
