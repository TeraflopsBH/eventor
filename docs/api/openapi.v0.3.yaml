      security: [{ StaffSession: [], StaffCsrf: [] }]
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
