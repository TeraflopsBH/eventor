        eventId: { type: string, format: uuid }
        venueSpaceRevisionId: { type: string, format: uuid }
        collaborationGrantId: { type: string, format: uuid }
        sourceContentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        approvedLayerIds: { type: array, uniqueItems: true, description: "Spatial layer IDs belonging to the exact published venue-space revision. Only these layers and their source objects may be copied.", items: { type: string, format: uuid } }
        approvedResourceIds: { type: array, uniqueItems: true, description: "Resource-pool or discrete-unit IDs belonging to the venue containing the selected source revision.", items: { type: string, format: uuid } }
        expiresAt: { type: string, format: date-time }
    EventVenueSnapshotCreateRequest:
      type: object
      required: [shareId]
      properties:
        shareId: { type: string, format: uuid }
    PersonCreateRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, maxLength: 200 }
        lastName: { type: string, maxLength: 200 }
        displayName: { type: string, maxLength: 250 }
        preferredName: { type: string, maxLength: 200 }
        contacts: { type: array, items: { type: object, additionalProperties: true } }
    PersonPatchRequest:
      type: object
      minProperties: 1
      properties:
        firstName: { type: string, maxLength: 200 }
        lastName: { type: string, maxLength: 200 }
        displayName: { type: string, maxLength: 250 }
        preferredName: { type: string, maxLength: 200 }
        contacts: { type: array, items: { type: object, additionalProperties: true } }
    ParticipationCreateRequest:
      type: object
