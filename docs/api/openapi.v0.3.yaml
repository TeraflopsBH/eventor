        notificationCampaignStatus: { type: string, enum: [not_created, queued, partial, completed, failed] }
        notificationCampaignId: { $ref: '#/components/schemas/Uuid' }
    CancellationCampaignPreviewRequest:
      type: object
      required: [audienceKind]
      properties:
        audienceKind: { type: string, enum: [accepted_tentative, all_active_invitees, all_previously_invited, custom] }
        selectedParticipationIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    CancellationCampaignPreview:
      type: object
      required: [eventId, audienceKind, eligibleCount, excludedByConsentCount, audienceSnapshotHash]
      properties:
        eventId: { $ref: '#/components/schemas/Uuid' }
        audienceKind: { type: string }
        eligibleCount: { type: integer, minimum: 0 }
        excludedByConsentCount: { type: integer, minimum: 0 }
        audienceSnapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
    CancellationCampaignCreate:
      type: object
      required: [eventDecisionId, audienceKind, previewHash, templateRevisionId, locale]
      properties:
        eventDecisionId: { $ref: '#/components/schemas/Uuid' }
        audienceKind: { type: string, enum: [accepted_tentative, all_active_invitees, all_previously_invited, custom] }
        previewHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        templateRevisionId: { $ref: '#/components/schemas/Uuid' }
        locale: { type: string, default: bs-BA }
        selectedParticipationIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    CancellationCampaign:
      type: object
      required: [id, eventId, purpose, audienceKind, status, recipientCount, deliverySummary]
