        customParticipationIds: { type: array, items: { type: string, format: uuid } }
        channel: { type: string, enum: [email, sms, other] }
    NotificationCampaignCreateRequest:
      allOf:
        - $ref: '#/components/schemas/NotificationCampaignPreviewRequest'
        - type: object
          required: [eventDecisionId, templateRevisionId, previewToken]
          properties:
            eventDecisionId: { type: string, format: uuid }
            templateRevisionId: { type: string, format: uuid }
            previewToken: { type: string, minLength: 16, maxLength: 500 }
            exclusions:
              type: array
