  "/booking-drafts/{draftId}":
    get:
      tags: ["Booking Administration"]
      operationId: getBookingDraft
      summary: "Read a booking draft and its revision history"
      description: "Requires booking.draft.read or booking.draft.manage from an active organization-scope grant. The database returns only the current revision and revision metadata; the API decrypts the ECP1 values snapshot only after the permission-checked projection."
      security: [{ StaffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/PDraftId'
      responses:
        '200':
          description: "Successful response."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDraftResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  "/booking-drafts/{draftId}/revisions":
    post:
      tags: ["Booking Administration"]
      operationId: createBookingDraftRevision
      summary: "Create an immutable successor revision of a booking draft"
      description: "Requires booking.draft.manage from an active organization-scope grant. The draft must remain in draft status and expectedRevisionNumber must equal its current revision. Values are encrypted with ECP1 before persistence. A stale revision, active space/resource holds on the previous revision, or unavailable venue/resource reference is rejected. Existing revisions and their child lines are never updated or deleted."
      security: [{ StaffSession: [], StaffCsrf: [] }]
      parameters:
        - $ref: '#/components/parameters/PDraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingDraftRevisionRequest' }
      responses:
        '201':
          description: "Successful response."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDraftRevisionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
