        '422': { $ref: '#/components/responses/ValidationError' }

  /events/{eventId}/disruption-notices:
    get:
      tags: [Event Disruption]
      operationId: listEventDisruptionNotices
      summary: List scoped venue disruption notices for an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Only notices authorized by the event's active collaboration projection.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BookingDisruptionNotice' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /event-disruption-notices/{noticeId}/acknowledge:
    post:
      tags: [Event Disruption]
      operationId: acknowledgeEventDisruption
      summary: Acknowledge a provider-originated disruption notice
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Acknowledgement recorded under the event owner's organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDisruptionResolution' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /event-disruption-notices/{noticeId}/resolve:
    post:
      tags: [Event Disruption]
      operationId: resolveEventDisruption
      summary: Record the organizer's response to venue disruption
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolutionKind, notes]
              properties:
                resolutionKind: { type: string, enum: [relocate, amend_booking, postpone, cancel_event, unresolved] }
                notes: { type: string, maxLength: 4000 }
      responses:
        '200':
          description: Organizer-side resolution recorded; booking and event state transitions remain separate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDisruptionResolution' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /invitations/{invitationId}/resend:
    post:
      tags: [Guest Operations]
      operationId: resendInvitation
      summary: Retry delivery of the current invitation revision
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Invitation delivery retry queued; RSVP state is unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /invitations/{invitationId}/revoke:
    post:
      tags: [Guest Operations]
      operationId: revokeInvitation
      summary: Revoke an invitation link without rewriting its RSVP history
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Invitation revoked and active link invalidated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestInvitationView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /invitations/{invitationId}/reissue:
    post:
      tags: [Guest Operations]
      operationId: reissueInvitation
      summary: Issue a new invitation revision and link
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduleRevisionId, rsvpPolicyRevisionId]
              properties:
                scheduleRevisionId: { $ref: '#/components/schemas/Uuid' }
                rsvpPolicyRevisionId: { $ref: '#/components/schemas/Uuid' }
                locale: { type: string, default: bs-BA }
      responses:
        '202':
          description: New invitation revision/link generated; prior responses remain in history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rsvp-responses/{responseId}/corrections:
    post:
      tags: [Guest Operations]
      operationId: correctRsvpResponse
      summary: Append a correction to a previously recorded RSVP response
      parameters:
        - name: responseId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correctedResponse, reason]
              properties:
                correctedResponse: { type: string, enum: [accepted, declined, tentative] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
                receivedAt: { type: string, format: date-time }
      responses:
        '201':
          description: Correction appended; original response remains unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RsvpResponseRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs/{jobId}:
    get:
      tags: [Notifications]
      operationId: getJob
      summary: Read an asynchronous job status within the caller's tenant and scope
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Job status and safe result reference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    StaffSession:
      type: apiKey
      in: cookie
      name: eventor_session
      description: Staff session; every operation still checks active membership, scoped permission and tenant context.
    GuestInvitationCapability:
      type: apiKey
      in: header
      name: X-Guest-Invitation-Token
      description: Purpose-bound opaque invitation token. Never an admission credential.
    BookingActionCapability:
      type: apiKey
      in: header
      name: X-Booking-Action-Token
      description: Purpose-bound external booking action token. Does not create tenant membership.
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the aggregate revision read by the caller.
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated principal lacks the required permission or scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource unavailable or not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Domain state or resource availability conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Request or domain validation failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Anti-abuse or rate limit threshold exceeded.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Purpose-bound capability expired, revoked or replaced.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: Aggregate revision no longer matches If-Match.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Uuid:
      type: string
      format: uuid
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        requestId: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path: { type: string }
              code: { type: string }
              message: { type: string }
    TimeInterval:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
      description: Half-open interval [startsAt, endsAt); endsAt must be later.
    PublishedBookingForm:
      type: object
      required: [organization, formCode, revision, locale, fields]
      properties:
        organization:
          type: object
          required: [slug, displayName]
          properties:
            slug: { type: string }
            displayName: { type: string }
        formCode: { type: string }
        revision: { type: integer, minimum: 1 }
        locale: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [code, label, type]
            properties:
              code: { type: string }
              label: { type: string }
              type: { type: string, enum: [text, textarea, email, phone, date, time, datetime, select, multiselect, number, boolean, file] }
              required: { type: boolean, default: false }
              options:
                type: array
                items:
                  type: object
                  required: [id, label]
                  properties:
                    id: { type: string }
                    label: { type: string }
    BookingInquiryCreate:
      type: object
      required: [formRevision, requester, requested]
      properties:
        formRevision: { type: integer, minimum: 1 }
        requester:
          type: object
          required: [displayName]
          properties:
            displayName: { type: string, minLength: 1, maxLength: 200 }
            email: { type: string, format: email, maxLength: 320 }
            phone: { type: string, maxLength: 64 }
        requested:
          type: object
          properties:
            eventTitle: { type: string, maxLength: 300 }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            timezone: { type: string, default: Europe/Sarajevo }
            expectedAttendance: { type: integer, minimum: 0 }
            requestedSpaceCodes:
              type: array
              items: { type: string }
            answers:
              type: object
              additionalProperties: true
        attachments:
          type: array
          maxItems: 10
          items:
            type: object
            required: [uploadId]
            properties:
              uploadId: { type: string, format: uuid }
    BookingInquiryReceipt:
      type: object
      required: [inquiryReference, receivedAt]
      properties:
        inquiryReference: { type: string }
        receivedAt: { type: string, format: date-time }
        message: { type: string }
    BookingInquiryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, publicReference, status, submittedAt]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              publicReference: { type: string }
              status: { type: string }
              submittedAt: { type: string, format: date-time }
              requesterSummary: { type: string }
        page:
          type: object
          properties:
            nextCursor: { type: string }
    BookingDraftCreate:
      type: object
      required: [title, timezone]
      properties:
        sourceInquiryId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 300 }
        timezone: { type: string }
        initialValues: { type: object, additionalProperties: true }
    BookingDraftRevisionCreate:
      type: object
      required: [values, spaceLines]
      properties:
        values: { type: object, additionalProperties: true }
        spaceLines:
          type: array
          items:
            type: object
            required: [venueSpaceId, startsAt, endsAt, blockKind]
            properties:
              venueSpaceId: { $ref: '#/components/schemas/Uuid' }
              startsAt: { type: string, format: date-time }
              endsAt: { type: string, format: date-time }
              blockKind: { type: string, enum: [setup, rehearsal, event_use, teardown, buffer] }
        changeReason: { type: string, maxLength: 1000 }
    BookingDraft:
      type: object
      required: [id, organizationId, status, revisionNumber, values]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        organizationId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [draft, offered, confirmed, abandoned] }
        revisionNumber: { type: integer, minimum: 1 }
        values: { type: object, additionalProperties: true }
        etag: { type: string }
    ManualPriceAdjustment:
      type: object
      required: [code, amount, reason]
      properties:
        code: { type: string }
        amount: { type: number }
        reason: { type: string, maxLength: 1000 }
    BookingOffer:
      type: object
      required: [id, status, revision, totalAmount, currency]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string }
        revision: { type: integer, minimum: 1 }
        totalAmount: { type: number, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        validUntil: { type: string, format: date-time }
    ExternalOfferAcceptance:
      type: object
      required: [offerId, acceptanceStatus, receivedAt]
      properties:
        offerId: { $ref: '#/components/schemas/Uuid' }
        acceptanceStatus: { type: string, enum: [accepted, pending_venue_confirmation] }
        receivedAt: { type: string, format: date-time }
    Booking:
      type: object
      required: [id, bookingCode, status, revision, confirmedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        bookingCode: { type: string }
        status: { type: string, enum: [confirmed, completed, cancelled, closed] }
        revision: { type: integer, minimum: 1 }
        confirmedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        customerTerms: { type: object, additionalProperties: true }
        commercialSummary:
          type: object
          properties:
            totalAmount: { type: number, minimum: 0 }
            currency: { type: string }
    BookingCancellationPreview:
      type: object
      required: [bookingId, policyRevision, approvalRequired, reservationCount]
      properties:
        bookingId: { $ref: '#/components/schemas/Uuid' }
        policyRevision: { type: integer, minimum: 1 }
        approvalRequired: { type: boolean }
        reservationCount: { type: integer, minimum: 0 }
        commercialSummary: { type: object, additionalProperties: true }
        affectedContactsCount: { type: integer, minimum: 0 }
    ExternalCancellationReceipt:
      type: object
      required: [requestReference, status, receivedAt]
      properties:
        requestReference: { type: string }
        status: { type: string, enum: [submitted, under_review, effective] }
        receivedAt: { type: string, format: date-time }
        customerSummary: { type: string }
    BookingCancellationRequest:
      type: object
      required: [id, bookingId, status, requestedAt, reasonCode]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        bookingId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [submitted, under_review, approved, rejected, withdrawn, expired, effective] }
        requestedAt: { type: string, format: date-time }
        reasonCode: { type: string }
        decisionReason: { type: string }
    BookingDisruptionNotice:
      type: object
      required: [id, bookingId, publicSummary, issuedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        bookingId: { $ref: '#/components/schemas/Uuid' }
        publicSummary: { type: string }
        affectedInterval: { $ref: '#/components/schemas/TimeInterval' }
        issuedAt: { type: string, format: date-time }
    AvailabilityResult:
      type: object
      required: [isAvailable, conflicts]
      properties:
        isAvailable: { type: boolean }
        conflicts:
          type: array
          items:
            type: object
            required: [interval, conflictKind]
            properties:
              interval: { $ref: '#/components/schemas/TimeInterval' }
              conflictKind: { type: string, enum: [hold, booking, maintenance, closure] }
              publicReference: { type: string }
    EventCreate:
      type: object
      required: [eventCode, title, timezone]
      properties:
        eventCode: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 300 }
        descriptionInternal: { type: string, maxLength: 10000 }
        timezone: { type: string, default: Europe/Sarajevo }
        initialCapabilities:
          type: object
          properties:
            guestRegistry: { type: boolean, default: false }
            invitationsRsvp: { type: boolean, default: false }
            seating: { type: boolean, default: false }
            guestPortal: { type: boolean, default: false }
            checkin: { type: boolean, default: false }
            prerequisites: { type: boolean, default: false }
            operationsCockpit: { type: boolean, default: false }
    Event:
      type: object
      required: [id, organizationId, eventCode, title, status, revision]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        organizationId: { $ref: '#/components/schemas/Uuid' }
        eventCode: { type: string }
        title: { type: string }
        status: { type: string, enum: [draft, planned, scheduled, active, completed, cancelled, postponed, archived] }
        revision: { type: integer, minimum: 1 }
        currentScheduleRevision: { type: integer, minimum: 1 }
    EventCapabilities:
      type: object
      required: [eventId, revision, enabled]
      properties:
        eventId: { $ref: '#/components/schemas/Uuid' }
        revision: { type: integer, minimum: 1 }
        enabled:
          type: object
          additionalProperties: { type: boolean }
    EventCapabilityUpdate:
      type: object
      required: [enabled, reason]
      properties:
        enabled:
          type: object
          additionalProperties: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ResponsibilityAssignmentCreate:
      type: object
      required: [taskCode, taskLabel, accountableParty, performingParty]
      properties:
        taskCode: { type: string }
        taskLabel: { type: string }
        accountableParty: { $ref: '#/components/schemas/ResponsibilityParty' }
        performingParty: { $ref: '#/components/schemas/ResponsibilityParty' }
        approverMembershipId: { $ref: '#/components/schemas/Uuid' }
        collaborationGrantId: { $ref: '#/components/schemas/Uuid' }
        permittedProjection: { type: object, additionalProperties: true }
        dueAt: { type: string, format: date-time }
    ResponsibilityParty:
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { const: event_owner }
        - type: object
          required: [kind, organizationId]
          properties:
            kind: { const: organization }
            organizationId: { $ref: '#/components/schemas/Uuid' }
            membershipId: { $ref: '#/components/schemas/Uuid' }
        - type: object
          required: [kind, name]
          properties:
            kind: { const: external_party }
            name: { type: string }
    ResponsibilityAssignment:
      allOf:
        - $ref: '#/components/schemas/ResponsibilityAssignmentCreate'
        - type: object
          required: [id, status]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            status: { type: string, enum: [not_started, in_progress, blocked, completed, cancelled, waived] }
    CollaborationGrantCreate:
      type: object
      required: [granteeOrganizationId, scopeKind, purpose, allowedActions]
      properties:
        granteeOrganizationId: { $ref: '#/components/schemas/Uuid' }
        scopeKind: { type: string, enum: [venue, space, booking] }
        scopeId: { $ref: '#/components/schemas/Uuid' }
        purpose: { type: string, minLength: 1, maxLength: 500 }
        projection: { type: object, additionalProperties: true }
        allowedActions:
          type: array
          uniqueItems: true
          items: { type: string }
        validUntil: { type: string, format: date-time }
    CollaborationGrant:
      allOf:
        - $ref: '#/components/schemas/CollaborationGrantCreate'
        - type: object
          required: [id, status, grantorOrganizationId]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            grantorOrganizationId: { $ref: '#/components/schemas/Uuid' }
            status: { type: string, enum: [proposed, active, expired, revoked, declined] }
            acceptedAt: { type: string, format: date-time }
            revokedAt: { type: string, format: date-time }
    EventVenueSnapshot:
      type: object
      required: [id, eventId, sourceOrganizationId, sourceRevisionId, sourceContentSha256, copiedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        eventId: { $ref: '#/components/schemas/Uuid' }
        sourceOrganizationId: { $ref: '#/components/schemas/Uuid' }
        sourceRevisionId: { $ref: '#/components/schemas/Uuid' }
        sourceContentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        copiedAt: { type: string, format: date-time }
    GuestInvitationView:
      type: object
      required: [eventTitle, invitationStatus, rsvpPolicy]
      properties:
        eventTitle: { type: string }
        schedule:
          type: object
          properties:
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            timezone: { type: string }
            publicLocation: { type: string }
        invitationStatus: { type: string, enum: [active, revoked, replaced, expired, event_cancelled] }
        rsvpPolicy:
          type: object
          properties:
            allowedResponses:
              type: array
              items: { type: string, enum: [accepted, declined, tentative] }
            deadline: { type: string, format: date-time }
            canChangeResponse: { type: boolean }
    GuestRsvpReceipt:
      type: object
      required: [response, recordedAt, responseSequence]
      properties:
        response: { type: string, enum: [accepted, declined, tentative] }
        recordedAt: { type: string, format: date-time }
        responseSequence: { type: integer, minimum: 1 }
    StaffRsvpRecordCreate:
      type: object
      required: [response, sourceChannel, respondentKind, receivedAt]
      properties:
        response: { type: string, enum: [accepted, declined, tentative] }
        sourceChannel: { type: string, enum: [phone, in_person, email, written, representative, staff_entry, other] }
        respondentKind: { type: string, enum: [guest, representative, staff] }
        receivedAt: { type: string, format: date-time }
        reasonCode: { type: string, maxLength: 80 }
        restrictedNote: { type: string, maxLength: 2000 }
    RsvpResponseRecord:
      type: object
      required: [id, response, sourceChannel, receivedAt, recordedAt, sequence]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        response: { type: string, enum: [accepted, declined, tentative] }
        sourceChannel: { type: string }
        receivedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        sequence: { type: integer, minimum: 1 }
        correctsResponseId: { $ref: '#/components/schemas/Uuid' }
    EventCancellationPreview:
      type: object
      required: [eventId, eventRevision, invitationCounts, rsvpCounts, pendingMessages, linkedBookingCount]
      properties:
        eventId: { $ref: '#/components/schemas/Uuid' }
        eventRevision: { type: integer, minimum: 1 }
        invitationCounts:
          type: object
          properties:
            active: { type: integer, minimum: 0 }
            previouslyIssued: { type: integer, minimum: 0 }
        rsvpCounts:
          type: object
          properties:
            accepted: { type: integer, minimum: 0 }
            tentative: { type: integer, minimum: 0 }
            declined: { type: integer, minimum: 0 }
            unanswered: { type: integer, minimum: 0 }
        pendingMessages: { type: integer, minimum: 0 }
        linkedBookingCount: { type: integer, minimum: 0 }
        candidateAudienceCounts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
    EventChangeRequestCreate:
      type: object
      required: [changeKind, reasonCode, publicMessage]
      properties:
        changeKind: { type: string, enum: [cancel, postpone, reschedule] }
        reasonCode: { type: string, minLength: 1, maxLength: 80 }
        internalReason: { type: string, maxLength: 4000 }
        publicMessage: { type: string, minLength: 1, maxLength: 4000 }
        replacementSchedule:
          type: object
          properties:
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            timezone: { type: string }
            publicLocation: { type: string }
        reconfirmationPolicy:
          type: string
          enum: [none, accepted_tentative, all_active_invitees, all_invited]
    EventChangeRequest:
      type: object
      required: [id, eventId, changeKind, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        eventId: { $ref: '#/components/schemas/Uuid' }
        changeKind: { type: string, enum: [cancel, postpone, reschedule] }
        status: { type: string, enum: [submitted, under_review, approved, rejected, withdrawn, executed] }
        submittedAt: { type: string, format: date-time }
    EventDecision:
      type: object
      required: [id, eventId, decisionKind, effectiveAt, notificationCampaignStatus]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        eventId: { $ref: '#/components/schemas/Uuid' }
        decisionKind: { type: string, enum: [cancelled, postponed, rescheduled] }
        effectiveAt: { type: string, format: date-time }
        notificationCampaignStatus: { type: string, enum: [not_created, queued, partial, completed, failed] }
    CancellationCampaignPreviewRequest:
      type: object
      required: [audienceKind]
      properties:
        audienceKind: { type: string, enum: [accepted_tentative, all_active_invitees, all_previously_invited, custom] }
        selectedParticipationIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    CancellationCampaignPreview:
      type: object
      required: [eventId, audienceKind, eligibleCount, excludedByConsentCount, audienceSnapshotHash]
      properties:
        eventId: { $ref: '#/components/schemas/Uuid' }
        audienceKind: { type: string }
        eligibleCount: { type: integer, minimum: 0 }
        excludedByConsentCount: { type: integer, minimum: 0 }
        audienceSnapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
    CancellationCampaignCreate:
      type: object
      required: [eventDecisionId, audienceKind, previewHash, templateRevisionId, locale]
      properties:
        eventDecisionId: { $ref: '#/components/schemas/Uuid' }
        audienceKind: { type: string, enum: [accepted_tentative, all_active_invitees, all_previously_invited, custom] }
        previewHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        templateRevisionId: { $ref: '#/components/schemas/Uuid' }
        locale: { type: string, default: bs-BA }
        selectedParticipationIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    CancellationCampaign:
      type: object
      required: [id, eventId, purpose, audienceKind, status, recipientCount, deliverySummary]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        eventId: { $ref: '#/components/schemas/Uuid' }
        purpose: { type: string, enum: [event_cancellation, event_postponement, schedule_update, rsvp_reconfirmation] }
        audienceKind: { type: string }
        status: { type: string, enum: [draft, confirmed, queued, sending, completed, partial, failed, cancelled] }
        recipientCount: { type: integer, minimum: 0 }
        deliverySummary:
          type: object
          properties:
            delivered: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            suppressed: { type: integer, minimum: 0 }
    JobReceipt:
      type: object
      required: [jobId, status]
      properties:
        jobId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, running] }
        statusUrl: { type: string, format: uri-reference }
