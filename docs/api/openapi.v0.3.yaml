openapi: 3.1.1
info:
  title: Eventor API
  version: 0.3.0
  summary: API-first venue booking and optional event operations platform
  description: |
    Successor contract aligned with ADR 0004-0006 and the v0.3 domain designs.
    Booking and event cancellation are independent decisions. Venue providers
    never receive organizer guest data merely because they provide a venue.
    Booking-only workflows do not require operational-event or guest records.
servers:
  - url: https://eventor.example.invalid/api/v1
    description: Deployment URL placeholder; configure per installation.
security:
  - StaffSession: []
tags:
  - name: Public Booking
  - name: Booking
  - name: Booking Cancellation
  - name: Availability
  - name: Events
  - name: Collaboration
  - name: Guest Operations
  - name: Event Disruption
  - name: Notifications
paths:
  /public/organizations/{organizationSlug}/booking-forms/{formCode}:
    get:
      tags: [Public Booking]
      operationId: getPublishedPublicBookingForm
      summary: Read a published public booking form
      security: []
      parameters:
        - name: organizationSlug
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: formCode
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: locale
          in: query
          schema: { type: string, default: bs-BA }
      responses:
        '200':
          description: Public-safe, published form and allowed options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedBookingForm' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/organizations/{organizationSlug}/booking-inquiries:
    post:
      tags: [Public Booking]
      operationId: submitPublicBookingInquiry
      summary: Submit a venue booking inquiry
      description: Creates an immutable intake record; does not create a booking or event.
      security: []
      parameters:
        - name: organizationSlug
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingInquiryCreate' }
      responses:
        '201':
          description: Inquiry receipt; no internal workflow details are returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingInquiryReceipt' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /organizations/{organizationId}/booking-inquiries:
    get:
      tags: [Booking]
      operationId: listBookingInquiries
      summary: List booking inquiries for an organization
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: status
          in: query
          schema: { type: string, enum: [received, under_review, converted, declined, withdrawn, spam] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Permission-filtered inquiry page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingInquiryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /booking-inquiries/{inquiryId}/create-draft:
    post:
      tags: [Booking]
      operationId: createBookingDraftFromInquiry
      summary: Create a separate editable draft from an inquiry
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerMembershipId:
                  type: string
                  format: uuid
                initialInternalNote:
                  type: string
                  maxLength: 4000
      responses:
        '201':
          description: New draft and revision; inquiry remains unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDraft' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/{organizationId}/booking-drafts:
    post:
      tags: [Booking]
      operationId: createBookingDraft
      summary: Create a staff booking draft without an inquiry
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingDraftCreate' }
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDraft' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /booking-drafts/{draftId}/revisions:
    post:
      tags: [Booking]
      operationId: createBookingDraftRevision
      summary: Add a new immutable booking draft revision
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingDraftRevisionCreate' }
      responses:
        '201':
          description: New draft revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDraft' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /booking-draft-revisions/{revisionId}/offers:
    post:
      tags: [Booking]
      operationId: createBookingOffer
      summary: Prepare an immutable customer offer from a draft revision
      parameters:
        - name: revisionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, taxBasis, validUntil, cancellationPolicyRevisionId]
              properties:
                priceListRevisionId:
                  type: string
                  format: uuid
                currency:
                  type: string
                  pattern: '^[A-Z]{3}$'
                  default: BAM
                taxBasis:
                  type: string
                  enum: [inclusive, exclusive, not_applicable, to_be_confirmed]
                validUntil:
                  type: string
                  format: date-time
                cancellationPolicyRevisionId:
                  type: string
                  format: uuid
                commercialTerms:
                  type: object
                  additionalProperties: true
                manualAdjustments:
                  type: array
                  items: { $ref: '#/components/schemas/ManualPriceAdjustment' }
      responses:
        '201':
          description: Offer revision prepared; issue/send is a separate action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingOffer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /booking-offers/{offerId}/issue:
    post:
      tags: [Booking]
      operationId: issueBookingOffer
      summary: Issue an offer and create a scoped external action capability
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offerRevisionId, deliveryChannel, authorizedContactId]
              properties:
                offerRevisionId: { type: string, format: uuid }
                deliveryChannel: { type: string, enum: [email, manual] }
                authorizedContactId: { type: string, format: uuid }
                capabilityExpiresAt: { type: string, format: date-time }
      responses:
        '202':
          description: Offer issuance/notification queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /external/booking-offers/accept:
    post:
      tags: [Public Booking]
      operationId: acceptExternalBookingOffer
      summary: Accept an offer using its purpose-bound action capability
      security:
        - BookingActionCapability: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offerRevisionId, acceptance]
              properties:
                offerRevisionId: { type: string, format: uuid }
                acceptance: { type: boolean, const: true }
                acceptedByName: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Offer accepted; booking confirmation remains subject to venue approval and availability rules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalOfferAcceptance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  /bookings/{bookingId}:
    get:
      tags: [Booking]
      operationId: getBooking
      summary: Read a permission-filtered booking projection
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Booking and pinned commercial snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /availability/space:
    post:
      tags: [Availability]
      operationId: checkSpaceAvailability
      summary: Preview space availability for half-open time intervals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueSpaceId, intervals]
              properties:
                venueSpaceId: { type: string, format: uuid }
                intervals:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/TimeInterval' }
                excludeBookingId: { type: string, format: uuid }
      responses:
        '200':
          description: Advisory availability result; final confirmation rechecks under database locks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /bookings/{bookingId}/cancellation-preview:
    post:
      tags: [Booking Cancellation]
      operationId: previewBookingCancellation
      summary: Preview pinned policy, approval and resource-release consequences
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Safe preview; does not cancel or release anything.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingCancellationPreview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /external/booking-actions/cancellation-requests:
    post:
      tags: [Public Booking, Booking Cancellation]
      operationId: submitExternalBookingCancellationRequest
      summary: Submit a booking cancellation request without tenant membership
      description: The booking is resolved from the purpose-bound token; clients do not submit a booking ID.
      security:
        - BookingActionCapability: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, minLength: 1, maxLength: 80 }
                explanation: { type: string, maxLength: 2000 }
                requestedEffectiveAt: { type: string, format: date-time }
      responses:
        '202':
          description: Request recorded; it is not an effective cancellation unless policy permits self-service.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalCancellationReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /booking-cancellation-requests/{requestId}:
    get:
      tags: [Booking Cancellation]
      operationId: getBookingCancellationRequest
      summary: Read a cancellation request and its permitted decision summary
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Permission-filtered cancellation request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingCancellationRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /booking-cancellation-requests/{requestId}/approve:
    post:
      tags: [Booking Cancellation]
      operationId: approveBookingCancellationRequest
      summary: Approve a customer cancellation request
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisionReason]
              properties:
                decisionReason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Approval decision recorded; effective cancellation may be a distinct command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingCancellationRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /booking-cancellation-requests/{requestId}/reject:
    post:
      tags: [Booking Cancellation]
      operationId: rejectBookingCancellationRequest
      summary: Reject a customer cancellation request
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisionReason]
              properties:
                decisionReason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Rejection recorded; confirmed reservation remains active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingCancellationRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{bookingId}/venue-cancellation:
    post:
      tags: [Booking Cancellation]
      operationId: initiateVenueBookingCancellation
      summary: Initiate venue-provider cancellation due to venue/service unavailability
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode, publicSummary]
              properties:
                reasonCode: { type: string, minLength: 1, maxLength: 80 }
                internalExplanation: { type: string, maxLength: 4000 }
                publicSummary: { type: string, minLength: 1, maxLength: 2000 }
                affectedInterval: { $ref: '#/components/schemas/TimeInterval' }
      responses:
        '202':
          description: Venue cancellation/disruption workflow initiated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueBookingCancellationInitiation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{bookingId}/cancellation-execution:
    post:
      tags: [Booking Cancellation]
      operationId: executeBookingCancellation
      summary: Commit effective booking cancellation and atomically release future reservations
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancellationRequestId, confirmedPreviewRevision]
              properties:
                cancellationRequestId: { type: string, format: uuid }
                confirmedPreviewRevision: { type: integer, minimum: 1 }
                emergencyOverrideReason: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Booking cancellation committed; notifications are queued asynchronously.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /organizations/{organizationId}/events:
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create an organizer-owned operational event
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreate' }
      responses:
        '201':
          description: Event created without automatically enabling guest capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /events/{eventId}/capabilities:
    get:
      tags: [Events]
      operationId: getEventCapabilities
      summary: Read published optional capabilities for an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Current capability revision and enabled features.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCapabilities' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Events]
      operationId: publishEventCapabilities
      summary: Publish a new versioned event capability set
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCapabilityUpdate' }
      responses:
        '200':
          description: New capability revision published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCapabilities' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /events/{eventId}/responsibility-assignments:
    get:
      tags: [Events]
      operationId: listEventResponsibilityAssignments
      summary: List task responsibility assignments visible to the caller
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Permission-filtered task assignment list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ResponsibilityAssignment' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Events]
      operationId: createEventResponsibilityAssignment
      summary: Assign accountability and performance for an event task
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponsibilityAssignmentCreate' }
      responses:
        '201':
          description: Responsibility assignment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsibilityAssignment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organizations/{organizationId}/collaboration-grants:
    post:
      tags: [Collaboration]
      operationId: proposeCollaborationGrant
      summary: Propose a scoped cross-organization collaboration grant
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollaborationGrantCreate' }
      responses:
        '201':
          description: Grant proposal created; grantee access is not active until acceptance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollaborationGrant' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /collaboration-grants/{grantId}/accept:
    post:
      tags: [Collaboration]
      operationId: acceptCollaborationGrant
      summary: Accept a collaboration grant as a member of the grantee organization
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                acceptanceNote: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Grant activated with the accepted scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollaborationGrant' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /collaboration-grants/{grantId}/revoke:
    post:
      tags: [Collaboration]
      operationId: revokeCollaborationGrant
      summary: Revoke a grant and block further collaboration actions
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Grant revoked; prior audit and event-owned snapshots are retained.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollaborationGrant' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{eventId}/venue-snapshots:
    post:
      tags: [Collaboration]
      operationId: createEventVenueSnapshot
      summary: Copy an approved venue share into an event-owned immutable snapshot
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
