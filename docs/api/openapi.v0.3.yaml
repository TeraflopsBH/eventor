      description: "A v1 field. Type-specific constraints are enforced by the public inquiry API; see docs/product/PUBLIC_BOOKING_FORM_SCHEMA_v1.md."
    PublicBookingFormFieldSchemaV1:
      type: object
      required: [fields]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
