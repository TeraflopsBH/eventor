        answers:
          type: object
          maxProperties: 100
          additionalProperties: true
          description: Dynamic answers are stored encrypted and validated against the exact published revision. Keys must match field codes; values must satisfy the declared field type, required flag, length/range constraints and pinned option membership. Unknown keys are rejected.
        attachmentReferences:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 200 }
          description: Reserved for future attachment upload support. Non-empty values currently receive 422.
      additionalProperties: false
