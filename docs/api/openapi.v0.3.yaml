  "/booking-draft-revisions/{revisionId}/confirm":
    post:
      tags: ["Booking Administration"]
      operationId: confirmBooking
      summary: "Explicitly confirm an accepted and approved booking with final reservation conversion"
      description: "Requires booking.confirm. The exact current draft revision must have an accepted offer and all pinned approval requirements satisfied. The command creates the booking and immutable commercial snapshots, then converts every required live space/resource hold in the same transaction. Missing/expired holds or final capacity conflicts abort the transaction."
      security: [{ StaffSession: [], StaffCsrf: [] }]
      parameters:
        - $ref: '#/components/parameters/PRevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingConfirmationRequest' }
      responses:
        '201':
          description: "Successful response."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  "/booking-draft-revisions/{revisionId}/offers":
    post:
      tags: ["Booking Administration"]
      operationId: createBookingOffer
      summary: "Prepare a customer offer from an immutable booking draft revision"
      description: "Calculates line prices from the selected published price-list revision and pins the published cancellation and approval policy revisions. This creates a prepared offer revision only; a separate explicit issue command publishes the offer to the customer."
      security: [{ StaffSession: [], StaffCsrf: [] }]
      parameters:
        - $ref: '#/components/parameters/PRevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingOfferCreateRequest' }
      responses:
        '201':
          description: "Successful response."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
