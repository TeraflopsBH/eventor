openapi: 3.1.1
info:
  title: Eventor API
  version: 0.3.0
  summary: API-first contract for venue booking and optional event operations.
  description: >-
    Successor contract aligned with ADR 0004-0006 and the v0.3 domain designs.
    Booking-only venue workflows do not require events or guest data. Cross-organization
    access is grant-scoped, organizer guest data remains organizer-owned, and booking
    cancellation is independent of event cancellation. Implemented routes include staff
    authentication, selected event and booking commands, notification campaign
    review/confirmation/queueing, and tenant-scoped SMTP configuration and test delivery.
    Other contract operations remain pending.
tags:
  - name: Authentication
  - name: Authorization
  - name: Public Booking Intake
  - name: Booking Administration
  - name: Venue Inventory
  - name: Resource Availability
  - name: Booking Cancellation
  - name: Cancellation Policy
  - name: Events
  - name: Event Capabilities
  - name: Event Responsibilities
  - name: Event Disruption
  - name: Collaboration
  - name: Venue Snapshot Sharing
  - name: Guest Registry
  - name: Event Participation
  - name: Invitations and RSVP
  - name: Guest RSVP
  - name: Event Cancellation
  - name: Event Scheduling
  - name: Event Notifications
  - name: Organization Delivery
  - name: Allocation
  - name: Check-in
  - name: Event Readiness
  - name: Operations
  - name: Jobs
  - name: Audit
paths:
