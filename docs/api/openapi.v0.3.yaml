  "/organization/delivery/email/resend-webhook":
    get:
      tags: ["Organization Delivery"]
      operationId: getOrganizationResendWebhookConfiguration
      summary: "Read Resend callback endpoint status"
      description: "Requires organization.delivery.manage. Returns the public callback URL and whether the signing secret is configured. The signing secret is never returned."
      security: [{ StaffSession: [] }]
      responses:
        "200":
          description: "Safe Resend callback configuration."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  "/organization/delivery/email/resend-webhook/prepare":
    post:
      tags: ["Organization Delivery"]
      operationId: prepareOrganizationResendWebhook
      summary: "Prepare a Resend callback endpoint"
      description: "Requires organization.delivery.manage and an idempotency key. The current SMTP host must be smtp.resend.com. Returns a public callback URL with a non-secret endpoint UUID. The Resend webhook must still be created in the provider dashboard and its signing secret activated."
      security: [{ StaffSession: [], StaffCsrf: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        "201":
          description: "Resend callback endpoint prepared."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { description: "The public API URL is not configured." }
        "500": { $ref: "#/components/responses/InternalServerError" }
  "/organization/delivery/email/resend-webhook/activate":
    post:
      tags: ["Organization Delivery"]
      operationId: activateOrganizationResendWebhook
      summary: "Store and activate the Resend webhook signing secret"
      description: "Requires organization.delivery.manage and an idempotency key. The whsec_ signing secret is encrypted before database persistence and is never returned."
      security: [{ StaffSession: [], StaffCsrf: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpointId, signingSecret]
              properties:
                endpointId: { type: string, format: uuid }
                signingSecret:
                  type: string
                  minLength: 24
                  maxLength: 512
                  pattern: "^whsec_[A-Za-z0-9+/]+={0,2}$"
                  writeOnly: true
              additionalProperties: false
      responses:
        "201":
          description: "Resend webhook signature verification is enabled."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  "/webhooks/resend/{endpointId}":
    post:
      tags: ["Organization Delivery"]
      operationId: receiveResendDeliveryWebhook
      summary: "Receive a signed Resend email delivery event"
      description: "Public provider endpoint. Requests require valid Svix v1 signature headers over the exact raw JSON body, with a timestamp no more than five minutes from server time. Only email.delivered and email.bounced are applied. SMTP acceptance is not inbox placement. The endpoint UUID is a routing identifier, not authentication."
      security: []
      parameters:
        - name: endpointId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: svix-id
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: svix-timestamp
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9]{1,12}$" }
        - name: svix-signature
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: { type: string }
                data:
                  type: object
                  properties:
                    message_id: { type: string, minLength: 3, maxLength: 500 }
                    email_id: { type: string }
                    to:
                      type: array
                      minItems: 1
                      maxItems: 1
                      items: { type: string, format: email }
                  additionalProperties: true
              additionalProperties: true
      responses:
        "200": { description: "Signed delivery or bounce event recorded idempotently." }
        "204": { description: "Authenticated event type intentionally ignored." }
        "400": { description: "Malformed or unsupported event payload." }
        "401": { description: "Missing or invalid Svix signature." }
        "404": { description: "Endpoint or correlated delivery attempt not found." }
        "409": { description: "Event conflicts with the existing delivery state." }
        "503": { description: "Temporary storage or key failure; the provider may retry." }
components:
  securitySchemes:
    StaffSession:
      type: apiKey
      in: cookie
      name: __Host-eventor_session
      description: Staff authentication cookie. Mutations require CSRF/origin protection and server-side membership/permission checks.
    StaffCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token paired with the session's readable CSRF cookie and checked against its server-side hash. Required for state-changing staff requests.
    GuestInvitationCapability:
      type: apiKey
      in: header
      name: X-Guest-Invitation-Token
      description: Opaque purpose-bound token for one guest invitation. Never accepts a staff cookie as a substitute.
    GuestInvitationBootstrap:
      type: apiKey
      in: header
      name: X-Guest-Invitation-Token
      description: One-time resolution context for a guest invitation link; resolution is non-consuming.
    BookingActionCapability:
      type: apiKey
      in: header
      name: X-External-Booking-Token
      description: Opaque purpose-bound capability limited to one booking and allowed customer actions.
    BookingActionBootstrap:
      type: apiKey
      in: header
      name: X-External-Booking-Action-Token
      description: Initial booking action token exchanged for a narrowly scoped external capability context.
    GuestPortalCapability:
      type: apiKey
      in: header
      name: X-Guest-Portal-Token
      description: Separate personal guest portal capability; not an invitation link or admission credential.
    GuestPortalBootstrap:
      type: apiKey
      in: header
      name: X-Guest-Portal-Access-Token
      description: Resolve a personal portal token into a limited context; resolution is non-consuming.
  parameters:
    PAllocationRevisionId:
      name: allocationRevisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PAssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PBookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PCampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PCapabilityId:
      name: capabilityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PDraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PEventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PFormCode:
      name: formCode
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    PGrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PHoldId:
      name: holdId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PInquiryId:
      name: inquiryId
      in: path
      required: true
