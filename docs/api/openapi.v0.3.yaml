  "/organization/delivery/email/test":
    post:
      tags: ["Organization Delivery"]
      operationId: testOrganizationEmailDelivery
      summary: "Send an explicitly requested SMTP test email"
      description: "Requires organization.delivery.manage and an idempotency key. Verifies the configured SMTP connection and sends a test message only to the supplied address. A successful test enables the current SMTP configuration revision for campaign queueing. Replaying the same key never sends a second test message."
      security: [{ StaffSession: [], StaffCsrf: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient]
              additionalProperties: false
              properties:
                recipient: { type: string, format: email, maxLength: 320 }
      responses:
        '200':
          description: "SMTP test message accepted and current configuration enabled."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '202':
          description: "The idempotent SMTP test request is already pending."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502':
          description: "SMTP verification or test message delivery failed."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  "/organization/delivery/email/configuration":
    get:
      tags: ["Organization Delivery"]
      operationId: getOrganizationEmailDeliveryConfiguration
      summary: "Read the current organization's SMTP configuration"
      security: [{ StaffSession: [] }]
      responses:
        '200':
          description: "Safe configuration projection; credentials are never returned."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: ["Organization Delivery"]
      operationId: configureOrganizationEmailDelivery
      summary: "Create a new version of the organization's SMTP configuration"
      description: "Requires organization.delivery.manage. SMTP credentials are write-only, encrypted by the API and never returned. STARTTLS or implicit TLS is required. This operation configures settings only; it does not send a test message or deliver campaigns."
      security: [{ StaffSession: [], StaffCsrf: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationEmailDeliveryConfigRequest' }
      responses:
        '201':
          description: "A new immutable configuration revision was created."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  "/auth/session":
