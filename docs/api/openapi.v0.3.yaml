        fields:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/PublicBookingFormFieldV1' }
      additionalProperties: false
    PublicBookingFormResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
