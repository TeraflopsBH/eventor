            revisionNumber: { type: integer, minimum: 1 }
            locale: { type: string }
            fieldSchema: { $ref: '#/components/schemas/PublicBookingFormFieldSchemaV1' }
            publishedAt: { type: string, format: date-time }
          additionalProperties: false
      additionalProperties: false
