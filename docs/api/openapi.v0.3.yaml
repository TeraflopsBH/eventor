        dueAt: { type: string, format: date-time }
    PrerequisiteCompletionRequest:
      type: object
      required: [confirmedAt, confirmationNote]
      properties:
        confirmedAt: { type: string, format: date-time }
        confirmationNote: { type: string, minLength: 3, maxLength: 2000 }
