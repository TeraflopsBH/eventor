    PRunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PSessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PSnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PVenueId:
      name: venueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key scoped to principal and operation; replays return the original outcome.
      schema: { type: string, minLength: 8, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Expected aggregate ETag. Stale state returns 412.
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid authentication/capability.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The authenticated principal lacks the required permission or scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found or not visible to this principal.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Domain state, availability, capability or idempotency conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Guest or external action capability expired, revoked or superseded.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: The supplied expected aggregate revision is stale.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Domain validation or policy rule rejected the command.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit or anti-abuse control triggered.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalServerError:
      description: Unexpected server error. Response contains no internal details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
      additionalProperties: true
    DataEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    ListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { type: object, additionalProperties: true }
        meta:
          type: object
          properties:
            nextCursor: { type: [string, "null"] }
            limit: { type: integer, minimum: 1 }
            totalCount: { type: [integer, "null"], minimum: 0 }
          additionalProperties: true
    JobEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [jobId, state]
          properties:
            jobId: { type: string, format: uuid }
            state: { type: string, enum: [queued, running] }
            statusUrl: { type: string, format: uri-reference }
            acceptedAt: { type: string, format: date-time }
    CommandRequest:
      type: object
      additionalProperties: false
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 2000 }
        reasonCode: { type: string, maxLength: 100 }
    OrganizationEmailDeliveryConfigRequest:
      type: object
      required: [host, port, transportSecurity, authMode, senderEmail]
      additionalProperties: false
      properties:
        host: { type: string, minLength: 1, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        transportSecurity: { type: string, enum: [starttls, implicit_tls] }
        authMode: { type: string, enum: [none, password] }
        senderEmail: { type: string, format: email, maxLength: 320 }
        senderName: { type: string, maxLength: 200 }
        replyTo: { type: string, format: email, maxLength: 320 }
        connectionTimeoutMs: { type: integer, minimum: 1000, maximum: 60000, default: 15000 }
        credentials:
          type: object
          required: [username, password]
          additionalProperties: false
          properties:
            username: { type: string, minLength: 1, maxLength: 320 }
            password: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
        clearCredentials: { type: boolean, default: false }
    SessionCreateRequest:
      type: object
      required: [email, password, organizationSlug]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 1024, writeOnly: true }
        organizationSlug: { type: string, minLength: 2, maxLength: 80 }
    PublicBookingFormOptionV1:
      type: object
      required: [value, label]
      properties:
        value: { type: string, minLength: 1, maxLength: 200 }
        label: { type: string, minLength: 1, maxLength: 200 }
      additionalProperties: false
    PublicBookingFormFieldV1:
      type: object
      required: [code, type]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z][a-z0-9_]{0,79}      type: object
      required: [formCode, formRevisionId, requester, requested, answers]
      properties:
        formCode:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: Stable code of the public booking form being submitted.
        formRevisionId:
          type: string
          format: uuid
          description: Published form revision returned by the public form endpoint.
        requester:
          type: object
