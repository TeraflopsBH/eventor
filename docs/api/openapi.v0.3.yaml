        status: { type: string, enum: [submitted, under_review, approved, rejected, withdrawn, executed] }
        submittedAt: { type: string, format: date-time }
    EventDecision:
      type: object
      required: [id, eventId, decisionKind, effectiveAt, notificationCampaignStatus]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        eventId: { $ref: '#/components/schemas/Uuid' }
        decisionKind: { type: string, enum: [cancelled, postponed, rescheduled] }
