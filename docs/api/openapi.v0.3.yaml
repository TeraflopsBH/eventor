      tags: ["Organization Delivery"]
      operationId: prepareOrganizationResendWebhook
      summary: "Prepare a Resend callback endpoint"
      description: "Requires organization.delivery.manage and an idempotency key. The current SMTP host must be smtp.resend.com. Returns a public callback URL with a non-secret endpoint UUID. The Resend webhook must still be created in the provider dashboard and its signing secret activated."
