    InvitationIssueRequest:
      type: object
      required: [participationIds, templateRevisionId, rsvpPolicyRevisionId]
      properties:
        participationIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid } }
        templateRevisionId: { type: string, format: uuid }
        rsvpPolicyRevisionId: { type: string, format: uuid }
        locale: { type: string, default: bs-BA }
        channel: { type: string, enum: [email, sms], default: email }
    InvitationDeliveryRequest:
      type: object
      properties:
        channel: { type: string, enum: [email, sms] }
    InvitationReissueRequest:
      type: object
      required: [templateRevisionId, rsvpPolicyRevisionId]
      properties:
