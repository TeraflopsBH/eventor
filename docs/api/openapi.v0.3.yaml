      type: object
      properties:
        expectedEventRevision: { type: integer, minimum: 1 }
        proposedAudience: { type: string, enum: [accepted_tentative, all_active_invitees, all_previously_invited, custom] }
    EventChangeRequest:
      type: object
      required: [changeKind, expectedEventRevision, reasonCode]
      properties:
        changeKind: { type: string, enum: [cancel, postpone, reschedule] }
        expectedEventRevision: { type: integer, minimum: 1 }
        reasonCode: { type: string, minLength: 2, maxLength: 100 }
        reasonInternal: { type: string, maxLength: 4000, writeOnly: true, description: "Encrypted by the API before persistence; never stored or returned as plaintext." }
        publicMessage: { type: string, maxLength: 4000 }
        replacementSchedule:
          type: object
          required: [startsAt, endsAt, timezone]
          properties:
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            timezone: { type: string, minLength: 1, maxLength: 100 }
            venueSummary: { type: object, additionalProperties: true }
            materialChange: { type: boolean, default: true }
            reconfirmationPolicy: { type: string, enum: [none, accepted_tentative, all_active_invitees, all_invited], default: accepted_tentative }
          additionalProperties: false
      allOf:
        - if:
            properties: { changeKind: { enum: [postpone, reschedule] } }
          then:
            required: [replacementSchedule]
        - if:
            properties: { changeKind: { const: cancel } }
          then:
            not: { required: [replacementSchedule] }
    EventChangeDecisionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 2000 }
    EventChangeExecutionRequest:
      type: object
      required: [expectedEventRevision]
      properties:
        expectedEventRevision: { type: integer, minimum: 1 }
        campaignAudience: { type: string, enum: [accepted_tentative, all_active_invitees, all_previously_invited, custom] }
        customParticipationIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid }, description: "Required when campaignAudience is custom; omitted for other audience kinds." }
        sendNotifications: { type: boolean, default: true }
    EventScheduleRevisionRequest:
      type: object
      required: [startsAt, endsAt, timezone]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
        venueSummary: { type: object, additionalProperties: true }
        materialChange: { type: boolean }
        reconfirmationPolicy: { type: string, enum: [none, accepted_tentative, all_active_invitees, all_invited] }
