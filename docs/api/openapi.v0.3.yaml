  /venues/{venueId}/snapshot-shares:
    post:
      tags: [Collaboration]
      operationId: createVenueSnapshotShare
      summary: Approve a venue-space revision and selected layers/resources for an event owner
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spaceRevisionId, eventOwnerOrganizationId, eventId, collaborationGrantId, layerCodes]
              properties:
                spaceRevisionId: { $ref: '#/components/schemas/Uuid' }
                eventOwnerOrganizationId: { $ref: '#/components/schemas/Uuid' }
                eventId: { $ref: '#/components/schemas/Uuid' }
                collaborationGrantId: { $ref: '#/components/schemas/Uuid' }
                layerCodes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string }
                resourceIds:
                  type: array
                  items: { $ref: '#/components/schemas/Uuid' }
                expiresAt: { type: string, format: date-time }
      responses:
        '201':
          description: Provider-approved, revision-pinned share.
          content:
            application/json:
              schema:
                type: object
                required: [shareId, sourceRevisionId, contentSha256]
                properties:
                  shareId: { $ref: '#/components/schemas/Uuid' }
                  sourceRevisionId: { $ref: '#/components/schemas/Uuid' }
                  contentSha256: { type: string, pattern: '^[0-9a-f]{64}  securitySchemes:
    StaffSession:
      type: apiKey
      in: cookie
      name: eventor_session
      description: Staff session; every operation still checks active membership, scoped permission and tenant context.
    GuestInvitationCapability:
      type: apiKey
      in: header
      name: X-Guest-Invitation-Token
      description: Purpose-bound opaque invitation token. Never an admission credential.
    BookingActionCapability:
      type: apiKey
      in: header
      name: X-Booking-Action-Token
      description: Purpose-bound external booking action token. Does not create tenant membership.
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the aggregate revision read by the caller.
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated principal lacks the required permission or scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource unavailable or not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Domain state or resource availability conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Request or domain validation failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Anti-abuse or rate limit threshold exceeded.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Purpose-bound capability expired, revoked or replaced.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: Aggregate revision no longer matches If-Match.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Uuid:
      type: string
      format: uuid
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        requestId: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path: { type: string }
              code: { type: string }
              message: { type: string }
    TimeInterval:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
      description: Half-open interval [startsAt, endsAt); endsAt must be later.
    PublishedBookingForm:
      type: object
      required: [organization, formCode, revision, locale, fields]
      properties:
        organization:
          type: object
          required: [slug, displayName]
          properties:
            slug: { type: string }
            displayName: { type: string }
        formCode: { type: string }
        revision: { type: integer, minimum: 1 }
        locale: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [code, label, type]
            properties:
              code: { type: string }
              label: { type: string }
              type: { type: string, enum: [text, textarea, email, phone, date, time, datetime, select, multiselect, number, boolean, file] }
              required: { type: boolean, default: false }
              options:
                type: array
                items:
                  type: object
                  required: [id, label]
                  properties:
                    id: { type: string }
                    label: { type: string }
    BookingInquiryCreate:
      type: object
      required: [formRevision, requester, requested]
      properties:
        formRevision: { type: integer, minimum: 1 }
        requester:
          type: object
          required: [displayName]
          properties:
            displayName: { type: string, minLength: 1, maxLength: 200 }
            email: { type: string, format: email, maxLength: 320 }
            phone: { type: string, maxLength: 64 }
        requested:
          type: object
          properties:
            eventTitle: { type: string, maxLength: 300 }
