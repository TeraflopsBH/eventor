      operationId: reconcileBookingOfferEmailDelivery
      summary: "Record a verified outcome for an uncertain offer email"
      description: "Requires booking.manage. This action never sends an email. Only confirmed_sent or confirmed_not_sent are accepted; a separate one-time retry may be authorised only after confirmed non-acceptance and while the exact offer revision remains current and unexpired."
      security: [{ StaffSession: [], StaffCsrf: [] }]
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution, reason]
              properties:
                resolution: { type: string, enum: [confirmed_sent, confirmed_not_sent] }
                reason: { type: string, minLength: 3, maxLength: 1000 }
                providerMessageReference: { type: string, maxLength: 998 }
              additionalProperties: false
      responses:
        '201':
          description: "Delivery outcome reconciled and audited."
