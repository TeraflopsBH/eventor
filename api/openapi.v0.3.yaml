        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationRunCreate' }
      responses:
        '202':
          description: Solver run queued against a pinned event-owned venue snapshot and allocation revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /allocation-runs/{runId}:
    get:
      tags: [Events]
      operationId: getAllocationRun
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Solver state, proposal, objective and diagnostics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationRunResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /allocation-runs/{runId}/commit:
    post:
      tags: [Events]
      operationId: commitAllocationRun
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, acceptance]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                acceptance: { type: string, enum: [all, selected] }
                acceptedAssignmentIds: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
                changeReason: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Selected solver proposal committed as a new allocation revision after server validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationRevisionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /allocation-revisions/{revisionId}/approve:
    post:
      tags: [Events]
      operationId: approveAllocationRevision
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected, returned_for_changes] }
                comment: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Allocation approval decision recorded. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /allocation-revisions/{revisionId}/publish:
    post:
      tags: [Events]
      operationId: publishAllocationRevision
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [audiences]
              properties:
                audiences:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: [staff, guest, print, management] }
      responses:
        '202':
          description: Authorized publication accepted; projections and documents refresh asynchronously.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /guest-portal/access/resolve:
    post:
      tags: [Invitations and RSVP]
      operationId: resolveGuestPortalAccess
      security:
        - guestPortalCapability: []
      responses:
        '200':
          description: Minimal personalized portal context; no general guest directory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestPortalContextResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }
  /guest-portal/me/allocation:
    get:
      tags: [Invitations and RSVP]
      operationId: getMyGuestAllocation
      security:
        - guestPortalCapability: []
      responses:
        '200':
          description: Own allocation and sanitized guest-safe map projection only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestAllocationViewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }
  /events/{eventId}/cockpit:
    get:
      tags: [Events]
      operationId: getEventCockpit
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Role- and task-projected operations summary with data freshness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CockpitResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /events/{eventId}/prerequisites:
    get:
      tags: [Events]
      operationId: listEventPrerequisites
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: External coordination/readiness items scoped to assigned responsibilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrerequisiteListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Events]
      operationId: createEventPrerequisite
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrerequisiteCreate' }
      responses:
        '201':
          description: External prerequisite task created with explicit responsibility assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrerequisiteResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /prerequisites/{prerequisiteId}/record-completion:
    post:
      tags: [Events]
      operationId: recordPrerequisiteCompletion
      parameters:
        - name: prerequisiteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmedAt, confirmationNote]
              properties:
                confirmedAt: { type: string, format: date-time }
                confirmationNote: { type: string, minLength: 3, maxLength: 1000 }
                reference: { type: string, maxLength: 200 }
      responses:
        '200': { description: Externally completed prerequisite recorded and audited. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/config-catalogues:
    get:
      tags: [Venue Resources]
      operationId: listConfigurationCatalogues
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Versioned configurable catalogues visible in the current organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogueListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /config-catalogues/{catalogueId}/options:
    get:
      tags: [Venue Resources]
      operationId: listCatalogueOptions
      parameters:
        - name: catalogueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Stable option identities and published localized option revisions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogueOptionListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /config-catalogue-revisions/{revisionId}/publish:
    post:
      tags: [Venue Resources]
      operationId: publishCatalogueRevision
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Catalogue revision published and immutable. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /booking-form-definitions/{formId}/revisions/{revisionId}/publish:
    post:
      tags: [Booking Public Intake]
      operationId: publishBookingFormRevision
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Booking form revision published and immutable. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /invitations/{invitationId}/resend:
    post:
      tags: [Invitations and RSVP]
      operationId: resendInvitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: New invitation delivery attempt queued without changing the guest's response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /invitations/{invitationId}/reissue:
    post:
      tags: [Invitations and RSVP]
      operationId: reissueInvitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '202':
          description: New invitation revision and link issued; previous history retained.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /participations/{participationId}/rsvp-history:
    get:
      tags: [Invitations and RSVP]
      operationId: getParticipationRsvpHistory
      parameters:
        - name: participationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Append-only RSVP history for authorized event staff.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RsvpResponse' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /rsvp-responses/{responseId}/corrections:
    post:
      tags: [Invitations and RSVP]
      operationId: correctRsvpResponse
      parameters:
        - name: responseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [replacementResponse, correctionReason]
              properties:
                replacementResponse: { type: string, enum: [accepted, declined, tentative] }
                correctionReason: { type: string, minLength: 3, maxLength: 2000 }
                receivedAt: { type: string, format: date-time }
      responses:
        '201':
          description: New append-only correction response created; original response remains unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RsvpResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: eventor_session
      description: HttpOnly, Secure, SameSite staff session cookie. CSRF protection applies to mutations.
    invitationCapability:
      type: apiKey
      in: header
      name: X-Invitation-Capability
      description: Opaque high-entropy capability limited to one invitation, guest and event; token hash only at rest.
    guestPortalCapability:
      type: apiKey
      in: header
      name: X-Guest-Portal-Capability
      description: Separate purpose-bound personal portal capability; not an invitation link or admission credential.
    externalBookingCapability:
      type: apiKey
      in: header
      name: X-Booking-Action-Capability
      description: Opaque purpose-bound booking action capability; it does not create tenant membership.
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InquiryId:
      name: inquiryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CancellationRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventChangeRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VenueId:
      name: venueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageCursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2048 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication or capability missing/invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Principal authenticated but lacks permission or scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found or unavailable to this principal.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Purpose-bound capability expired, revoked or replaced.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Current lifecycle state, reservation or idempotency conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: If-Match revision is stale.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Domain validation failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Anti-abuse or rate-limit control triggered.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    PersonCreate:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 150 }
        lastName: { type: string, minLength: 1, maxLength: 150 }
        displayName: { type: string, maxLength: 250 }
        preferredName: { type: string, maxLength: 150 }
        contactPoints:
          type: array
          items:
            type: object
            required: [kind, value]
            properties:
              kind: { type: string, enum: [email, phone, postal, other] }
              value: { type: string, writeOnly: true, maxLength: 2000 }
              primary: { type: boolean }
              consent: { type: string, enum: [unknown, permitted, restricted, withdrawn] }
            additionalProperties: false
      additionalProperties: false
    PersonPatch:
      type: object
      properties:
        firstName: { type: string, minLength: 1, maxLength: 150 }
        lastName: { type: string, minLength: 1, maxLength: 150 }
        displayName: { type: string, maxLength: 250 }
        preferredName: { type: string, maxLength: 150 }
        contactPoints:
          type: array
          items: { type: object, additionalProperties: true }
      additionalProperties: false
    Person:
      type: object
      required: [id, firstName, lastName, status]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        displayName: { type: string }
        preferredName: { type: string }
        status: { type: string, enum: [active, merged, archived] }
        contactPoints:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [email, phone, postal, other] }
              maskedValue: { type: string }
              consent: { type: string }
            additionalProperties: false
      additionalProperties: false
    PersonResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Person' }
        meta: { $ref: '#/components/schemas/Meta' }
    PersonListResponse:
      type: object
      required: [data, page, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Person' }
        page: { $ref: '#/components/schemas/Page' }
        meta: { $ref: '#/components/schemas/Meta' }
    GuestImportBatchResponse:
      type: object
      required: [id, state, sourceFilename, rowCount]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [uploaded, previewing, ready, committed, failed, cancelled] }
        sourceFilename: { type: string }
        rowCount: { type: integer, minimum: 0 }
        validRowCount: { type: integer, minimum: 0 }
        invalidRowCount: { type: integer, minimum: 0 }
        duplicateCandidates: { type: integer, minimum: 0 }
      additionalProperties: false
    VenueCreate:
      type: object
      required: [organizationId, code, name, timezone]
      properties:
        organizationId: { type: string, format: uuid }
        code: { type: string, minLength: 2, maxLength: 80 }
        name: { type: string, minLength: 2, maxLength: 250 }
        timezone: { type: string, default: Europe/Sarajevo }
        address: { type: object, additionalProperties: true }
      additionalProperties: false
    Venue:
      type: object
      required: [id, code, name, timezone, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        timezone: { type: string }
        status: { type: string, enum: [active, inactive, archived] }
        address: { type: object, additionalProperties: true }
        spaces: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: true
    VenueResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Venue' }
        meta: { $ref: '#/components/schemas/Meta' }
    VenueListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Venue' }
        meta: { $ref: '#/components/schemas/Meta' }
    SpatialObjectCreate:
      type: object
      required: [objectKind, geometry]
      properties:
        objectKind: { type: string, maxLength: 80 }
        stableCode: { type: string, maxLength: 120 }
        geometry: { type: object, additionalProperties: true }
        attributes: { type: object, additionalProperties: true }
      additionalProperties: false
    SpatialObject:
      type: object
      required: [id, objectKind, geometry]
      properties:
        id: { type: string, format: uuid }
        objectKind: { type: string }
        stableCode: { type: string }
        geometry: { type: object, additionalProperties: true }
        attributes: { type: object, additionalProperties: true }
      additionalProperties: false
    SpatialObjectResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/SpatialObject' }
        meta: { $ref: '#/components/schemas/Meta' }
    SpatialObjectListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SpatialObject' }
        meta: { $ref: '#/components/schemas/Meta' }
    AllocationRunCreate:
      type: object
      required: [allocationRevisionId, inputRevision]
      properties:
        allocationRevisionId: { type: string, format: uuid }
        inputRevision: { type: integer, minimum: 1 }
        solverOptions: { type: object, additionalProperties: true }
      additionalProperties: false
    AllocationRunResponse:
      type: object
      required: [id, status, inputSha256]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, infeasible, failed, cancelled] }
        inputSha256: { type: string, pattern: '^[0-9a-f]{64}      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        requestId: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
      additionalProperties: false
    Meta:
      type: object
      properties:
        requestId: { type: string }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
      additionalProperties: false
    Page:
      type: object
      required: [limit]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        nextCursor: { type: string }
      additionalProperties: false
    Principal:
      type: object
      required: [userId, displayName, memberships]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        memberships:
          type: array
          items:
            type: object
            required: [organizationId, membershipId, organizationName, status]
            properties:
              organizationId: { type: string, format: uuid }
              membershipId: { type: string, format: uuid }
              organizationName: { type: string }
              status: { type: string, enum: [active, invited, suspended, revoked] }
              permissionSummary:
                type: array
                items: { type: string }
      additionalProperties: false
    PrincipalResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Principal' }
        meta: { $ref: '#/components/schemas/Meta' }
    PublishedBookingFormResponse:
      type: object
      required: [formCode, revision, locale, fields]
      properties:
        formCode: { type: string }
        revision: { type: integer, minimum: 1 }
        locale: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [code, label, type, required]
            properties:
              code: { type: string }
              label: { type: string }
              type: { type: string, enum: [text, textarea, email, phone, date, time, datetime, number, select, multiselect, checkbox, file] }
              required: { type: boolean }
              options:
                type: array
                items:
                  type: object
                  required: [id, label]
                  properties:
                    id: { type: string, format: uuid }
                    label: { type: string }
              helpText: { type: string }
      additionalProperties: false
    BookingInquiryCreate:
      type: object
      required: [formRevision, requester, values]
      properties:
