openapi: 3.1.1
info:
  title: Eventor API
  version: 0.3.0
  summary: API-first contract for venue booking and optional event operations
  description: |
    Successor contract aligned with ADR 0004–0006 and the accepted v0.3 domain
    designs. A booking is independent of an operational event. Venue booking
    cancellation and organizer-owned event cancellation are separate decisions.
    Cross-organization access requires explicit grants and event-owned venue
    snapshots. Guest, RSVP, invitation, admission and attendance lifecycles are
    separate. Public, guest, external-booking and staff security contexts are
    intentionally distinct.
  contact:
    name: Eventor project
servers:
  - url: /api/v1
    description: Same-origin API behind the deployment reverse proxy
security:
  - staffSession: []
tags:
  - name: Authentication
  - name: Booking Public Intake
  - name: Booking Administration
  - name: Booking Cancellation
  - name: Venue Resources
  - name: Events
  - name: Collaboration
  - name: Guest Registry
  - name: Invitations and RSVP
  - name: Event Disruption
  - name: Notifications
  - name: Attendance
  - name: Jobs
paths:
  /auth/session:
    post:
      tags: [Authentication]
      operationId: createStaffSession
      security: []
      summary: Authenticate staff and establish a secure session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
      responses:
        '200':
          description: Session established; session token is set in an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrincipalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/session/current:
    delete:
      tags: [Authentication]
      operationId: deleteStaffSession
      summary: Revoke the current staff session
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      tags: [Authentication]
      operationId: getCurrentPrincipal
      summary: Get the current principal and organization memberships
      responses:
        '200':
          description: Current principal and safe membership/permission summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrincipalResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /public/organizations/{organizationSlug}/booking-forms/{formCode}:
    get:
      tags: [Booking Public Intake]
      operationId: getPublishedPublicBookingForm
      security: []
      summary: Retrieve a published public booking form
      parameters:
        - name: organizationSlug
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: formCode
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: locale
          in: query
          schema: { type: string, default: bs-BA }
      responses:
        '200':
          description: Public-safe form definition, visible fields and allowed catalogue options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedBookingFormResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /public/organizations/{organizationSlug}/booking-inquiries:
    post:
      tags: [Booking Public Intake]
      operationId: submitPublicBookingInquiry
      security: []
      summary: Submit a public venue booking inquiry
      parameters:
        - name: organizationSlug
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingInquiryCreate' }
      responses:
        '201':
          description: Inquiry received. Receipt contains no internal workflow details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingInquiryReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /organizations/{organizationId}/booking-inquiries:
    get:
      tags: [Booking Administration]
      operationId: listBookingInquiries
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: status
          in: query
          schema: { type: string, enum: [received, under_review, converted, declined, withdrawn, spam] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Permission-filtered inquiry inbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingInquiryListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /booking-inquiries/{inquiryId}:
    get:
      tags: [Booking Administration]
      operationId: getBookingInquiry
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Immutable original submission, attachments and separately stored annotations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingInquiryResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /booking-inquiries/{inquiryId}/create-draft:
    post:
      tags: [Booking Administration]
      operationId: createBookingDraftFromInquiry
      parameters:
        - $ref: '#/components/parameters/InquiryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ownerMembershipId:
                  type: string
                  format: uuid
                  description: Optional staff assignment target; never treated as actor identity.
                initialNote: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: Separate editable draft created; source inquiry remains unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDraftResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/booking-drafts:
    post:
      tags: [Booking Administration]
      operationId: createBookingDraft
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingDraftRevisionCreate' }
      responses:
        '201':
          description: Staff-created booking draft and first immutable revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDraftResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /booking-drafts/{draftId}/revisions:
    post:
      tags: [Booking Administration]
      operationId: createBookingDraftRevision
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingDraftRevisionCreate' }
      responses:
        '201':
          description: New immutable booking draft revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDraftResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /booking-draft-revisions/{revisionId}/offers:
    post:
      tags: [Booking Administration]
      operationId: createBookingOffer
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingOfferCreate' }
      responses:
        '201':
          description: Immutable customer-visible offer revision issued or prepared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingOfferResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /booking-offers/{offerId}/accept:
    post:
      tags: [Booking Administration]
      operationId: acceptBookingOffer
      security:
        - externalBookingCapability: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                acceptanceName: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Offer acceptance recorded against the capability-bound offer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingOfferResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }
        '409': { $ref: '#/components/responses/Conflict' }
  /booking-draft-revisions/{revisionId}/confirm:
    post:
      tags: [Booking Administration]
      operationId: confirmBooking
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedDraftRevision, approvalReference]
              properties:
                expectedDraftRevision: { type: integer, minimum: 1 }
                approvalReference: { type: string, format: uuid }
                acceptedOfferRevisionId: { type: string, format: uuid }
      responses:
        '201':
          description: Booking confirmed and all required space/resource blocks committed atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /organizations/{organizationId}/bookings:
    get:
      tags: [Booking Administration]
      operationId: listBookings
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: status
          in: query
          schema: { type: string, enum: [confirmed, completed, cancelled, closed] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Permission-filtered bookings and their reservation summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bookings/{bookingId}:
    get:
      tags: [Booking Administration]
      operationId: getBooking
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking projection filtered by role and booking ownership.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /organizations/{organizationId}/availability/spaces:
    post:
      tags: [Venue Resources]
      operationId: checkSpaceAvailability
      description: Availability is advisory until a hold or confirmation command commits under the reservation locks.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceAvailabilityRequest' }
      responses:
        '200':
          description: Available/unavailable result with safe conflict references.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /organizations/{organizationId}/availability/resources:
    post:
      tags: [Venue Resources]
      operationId: checkResourceAvailability
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceAvailabilityRequest' }
      responses:
        '200':
          description: Discrete-unit or pooled-capacity availability result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /bookings/{bookingId}/cancellation-requests:
    post:
      tags: [Booking Cancellation]
      operationId: submitBookingCancellationRequest
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingCancellationRequestCreate' }
      responses:
        '201':
          description: Cancellation request recorded; booking remains confirmed until effective execution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingCancellationRequestResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /external/booking-cancellation-requests:
    post:
      tags: [Booking Cancellation]
      operationId: submitExternalBookingCancellationRequest
      security:
        - externalBookingCapability: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reasonCode]
              properties:
                reasonCode: { type: string, minLength: 1, maxLength: 80 }
                explanation: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: Request submitted for the booking bound to the external capability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingCancellationRequestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }
        '409': { $ref: '#/components/responses/Conflict' }
  /booking-cancellation-requests/{requestId}:
    get:
      tags: [Booking Cancellation]
      operationId: getBookingCancellationRequest
      parameters:
        - $ref: '#/components/parameters/CancellationRequestId'
      responses:
        '200':
          description: Request and safe decision summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingCancellationRequestResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /booking-cancellation-requests/{requestId}/approve:
    post:
      tags: [Booking Cancellation]
      operationId: approveBookingCancellationRequest
      parameters:
        - $ref: '#/components/parameters/CancellationRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Approval recorded; effective execution remains a separate command when required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingCancellationRequestResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /booking-cancellation-requests/{requestId}/reject:
    post:
      tags: [Booking Cancellation]
      operationId: rejectBookingCancellationRequest
      parameters:
        - $ref: '#/components/parameters/CancellationRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Rejection recorded; booking reservations remain in place.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingCancellationRequestResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /bookings/{bookingId}/venue-cancellation:
    post:
      tags: [Booking Cancellation]
      operationId: initiateVenueBookingCancellation
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueCancellationInitiate' }
      responses:
        '201':
          description: Venue-side cancellation request and customer disruption notice recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingCancellationRequestResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /bookings/{bookingId}/cancellation-preview:
    post:
      tags: [Booking Cancellation]
      operationId: previewBookingCancellationEffects
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cancellationRequestId: { type: string, format: uuid }
      responses:
        '200':
          description: Policy revision, approval need, commercial summary and reservation-release preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingCancellationPreviewResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /bookings/{bookingId}/cancellation-execution:
    post:
      tags: [Booking Cancellation]
      operationId: executeBookingCancellation
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cancellationRequestId, previewRevision]
              properties:
                cancellationRequestId: { type: string, format: uuid }
                previewRevision: { type: integer, minimum: 1 }
                emergencyOverrideReason: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Effective cancellation committed atomically; notifications and follow-ups are queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /organizations/{organizationId}/events:
    post:
      tags: [Events]
      operationId: createEvent
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreate' }
      responses:
        '201':
          description: Organizer-owned event created. No guest capabilities are enabled unless explicitly configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /events/{eventId}:
    get:
      tags: [Events]
      operationId: getEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Role-projected event detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/{eventId}/capabilities:
    get:
      tags: [Events]
      operationId: getEventCapabilities
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Published capability set and enabled-module projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCapabilitiesResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Events]
      operationId: publishEventCapabilities
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCapabilitiesUpdate' }
      responses:
        '200':
          description: New immutable capability revision published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCapabilitiesResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /events/{eventId}/responsibilities:
    get:
      tags: [Events]
      operationId: listEventResponsibilities
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Permission-filtered accountable and performing-party assignments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsibilityListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Events]
      operationId: createEventResponsibilityAssignment
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponsibilityAssignmentCreate' }
      responses:
        '201':
          description: Responsibility assignment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsibilityResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /organizations/{organizationId}/collaboration-grants:
    post:
      tags: [Collaboration]
      operationId: proposeCollaborationGrant
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollaborationGrantCreate' }
      responses:
        '201':
          description: Scoped grant proposed to another Eventor organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollaborationGrantResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Collaboration]
      operationId: listCollaborationGrants
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: status
          in: query
          schema: { type: string, enum: [proposed, active, expired, revoked, declined] }
      responses:
        '200':
          description: Grants issued by or offered to the current organization, permission filtered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollaborationGrantListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /collaboration-grants/{grantId}/accept:
    post:
      tags: [Collaboration]
      operationId: acceptCollaborationGrant
      parameters:
        - $ref: '#/components/parameters/GrantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accepted]
              properties:
                accepted: { const: true }
      responses:
        '200':
          description: Grant accepted by an authorized member of the grantee organization.
          content:
            application/json:
