name: One-shot dependency lockfile refresh

on:
  push:
    branches:
      - feat/booking-allocation-alternatives
    paths:
      - apps/api/package.json
      - apps/staff-web/package.json
      - .github/workflows/refresh-dependency-lockfiles.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Regenerate API and staff-web lockfiles
        run: |
          set -euo pipefail
          for project in apps/api apps/staff-web; do
            (cd "$project" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
            (cd "$project" && npm ci --no-audit --no-fund)
            (cd "$project" && npm audit --audit-level=high)
          done
          (cd apps/api && npm test)
          (cd apps/staff-web && npm test && npm run build)
      - name: Commit refreshed lockfiles and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-dependency-lockfiles.yml
          git add apps/api/package-lock.json apps/staff-web/package-lock.json
          git commit -m "chore: refresh audited dependency lockfiles"
          git push origin "HEAD:${GITHUB_REF_NAME}"
