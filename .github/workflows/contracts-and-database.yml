name: Contracts and PostgreSQL migrations

on:
  workflow_dispatch:
  push:
    branches:
      - feat/postgresql18-migrations-openapi-v0.3
      - fix/pr26-high-risk-integrity-review
      - feat/booking-commercial-workflow
      - feat/booking-allocation-alternatives
      - fix/booking-offer-email-worker-db
      - main
  pull_request:
    branches:
      - main
      - fix/booking-offer-email-worker-db
      - feat/booking-allocation-alternatives
      - feat/postgresql18-migrations-openapi-v0.3
      - fix/pr26-high-risk-integrity-review
      - feat/booking-draft-allocation-availability-preview

permissions:
  contents: read

jobs:
  openapi:
    name: OpenAPI 3.1 contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run Eventor contract checks
        run: python scripts/validate_openapi.py docs/api/openapi.v0.3.yaml

      - name: Validate with pinned OpenAPI 3.1 validator
        run: python -m openapi_spec_validator docs/api/openapi.v0.3.yaml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"

      - name: Lint OpenAPI with pinned Redocly CLI
        run: npx --yes @redocly/cli@2.77.0 lint --config redocly.yaml docs/api/openapi.v0.3.yaml

      - name: Install API dependencies from committed lockfile
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: Audit API dependency tree for high and critical vulnerabilities
        working-directory: apps/api
        run: npm audit --audit-level=high

      - name: Generate OpenAPI TypeScript declarations, type-check and test API routes
        working-directory: apps/api
        run: npm test



  staff-web:
    name: Staff web type-check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Install staff web dependencies from committed lockfile
        working-directory: apps/staff-web
        run: npm ci --no-audit --no-fund
      - name: Audit staff web dependency tree for high and critical vulnerabilities
        working-directory: apps/staff-web
        run: npm run audit:dependencies
      - name: Run staff web regression tests
        working-directory: apps/staff-web
        run: npm test
      - name: Type-check and build staff web
        working-directory: apps/staff-web
        run: npm run build


  postgres:
    name: PostgreSQL 18.6 migrations, RLS and concurrency
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ADMIN_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/postgres
      MIGRATOR_URL: postgresql://eventor_migrator:eventor_ci_migrator_password@127.0.0.1:5432/eventor
      RUNTIME_URL: postgresql://eventor_runtime:eventor_ci_runtime_password@127.0.0.1:5432/eventor
      AUTH_URL: postgresql://eventor_auth:eventor_ci_auth_password@127.0.0.1:5432/eventor
      WORKER_URL: postgresql://eventor_worker:eventor_ci_worker_password@127.0.0.1:5432/eventor
      DATABASE_URL: postgresql://eventor_migrator:eventor_ci_migrator_password@127.0.0.1:5432/eventor
      EVENTOR_CONTACT_ENCRYPTION_KEY: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=
      EVENTOR_DELIVERY_CREDENTIALS_KEY: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install PostgreSQL 18 client and shell tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
          psql --version
          pg_dump --version
          pg_restore --version
          bash -n scripts/db/migrate.sh
          bash -n scripts/db/test_resource_concurrency.sh
          bash -n scripts/db/test_space_expiry_confirmation_race.sh
          bash -n scripts/db/test_space_overlap_concurrency.sh
          bash -n scripts/db/test_guest_invitation_authorization_revocation_race.sh
          bash -n scripts/db/test_guest_invitation_command_authorization_lock.sh
          bash -n scripts/db/test-concurrency.sh
          bash -n scripts/db/test-migrations.sh
          bash -n scripts/db/test-migration-history-gap.sh

      - name: Bootstrap least-privilege roles
        run: |
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE eventor OWNER postgres;"
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 -v database_name=eventor \
            -f scripts/db/bootstrap-roles.sql
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE eventor OWNER TO eventor_owner;"
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE eventor_migrator WITH PASSWORD 'eventor_ci_migrator_password';"
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE eventor_runtime WITH PASSWORD 'eventor_ci_runtime_password';"
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE eventor_worker WITH PASSWORD 'eventor_ci_worker_password';"
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE eventor_auth WITH PASSWORD 'eventor_ci_auth_password';"

      - name: Verify migration runner rejects missing historical migrations
        run: bash scripts/db/test-migration-history-gap.sh

      - name: Confirm PostgreSQL major and extension availability
        run: |
          server_version="$(psql "$MIGRATOR_URL" -X -At -v ON_ERROR_STOP=1 -c "SHOW server_version;")"
          echo "PostgreSQL server: $server_version"
          case "$server_version" in
            18.*) ;;
            *) echo "Expected PostgreSQL 18.x" >&2; exit 1 ;;
          esac

      - name: Rehearse populated schema upgrades and reference encryption binding
        run: |
          bash -n scripts/db/test-upgrade-000073-to-000074.sh
          bash scripts/db/test-upgrade-000073-to-000074.sh

      - name: Verify guest invitation capability and RSVP database boundary
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/guest_invitation_capability_smoke.sql

      - name: Verify forward-migrated guest invitation capability schema
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/guest_invitation_forward_migration_schema_smoke.sql

      - name: Verify safe public booking form projection
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/public_booking_form_smoke.sql
      - name: Verify rate-limited, idempotent public inquiry submission
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/public_booking_inquiry_smoke.sql
      - name: Verify permissioned staff booking inquiry workflow
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/staff_booking_inquiry_smoke.sql


      - name: Verify tenant isolation as non-owner runtime role
        run: |
          psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 \
            -v organization_a=11111111-1111-4111-8111-111111111111 \
            -v organization_b=22222222-2222-4222-8222-222222222222 \
            -f tests/database/rls_smoke.sql

      - name: Verify pooled capacity with independent concurrent connections
        run: bash scripts/db/test_resource_concurrency.sh

      - name: Run extended tenant, hierarchy and interval smoke tests
        env:
          DATABASE_URL_RUNTIME: postgresql://eventor_runtime:eventor_ci_runtime_password@127.0.0.1:5432/eventor
        run: bash scripts/db/test-migrations.sh

      - name: Verify collaboration link/share transition audit
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/collaboration_lifecycle_audit_smoke.sql

      - name: Verify event cancellation and postponement after invitation delivery
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_cancellation_postponement_smoke.sql

      - name: Verify event change commands, scoped permissions and replacement schedules
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_change_command_runtime_smoke.sql

      - name: Set up Node.js for PostgreSQL-backed worker and browser acceptance
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"

      - name: Install API dependencies and build the production API
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare event notification worker fixture
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_notification_worker_fixture.sql

      - name: Encrypt synthetic contact values before immutable campaign recipient snapshots
        env:
          EVENTOR_CONTACT_ENCRYPTION_KEY: ${{ env.EVENTOR_CONTACT_ENCRYPTION_KEY }}
          MIGRATOR_URL: ${{ env.MIGRATOR_URL }}
        run: node apps/api/scripts/prepare-notification-worker-fixture.mjs

      - name: Verify host-only staff account bootstrap
        run: node apps/api/scripts/staff-account-bootstrap-postgres-smoke.mjs

      - name: Verify host provisioning of existing-account memberships
        run: node apps/api/scripts/staff-membership-provisioning-postgres-smoke.mjs

      - name: Verify guest invitation delivery attempt-history transitions
        run: |
          ADMIN_EVENTOR_URL="${ADMIN_URL%/postgres}/eventor"
          psql "$ADMIN_EVENTOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/guest_invitation_delivery_attempt_history_smoke.sql

      - name: Verify system audit actor constraints used by invitation delivery workers
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/audit_system_actor_smoke.sql

      - name: Prepare an expired guest invitation delivery lease
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/guest_invitation_expired_lease_claim_fixture.sql

      - name: Recover expired guest invitation lease through the real worker claim
        run: psql "$WORKER_URL" -X -v ON_ERROR_STOP=1 -f tests/database/guest_invitation_expired_lease_claim_worker.sql

      - name: Verify worker lease recovery and attempt history
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/guest_invitation_expired_lease_claim_assert.sql

      - name: Prepare guest invitation SMTP authorization race fixture
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/guest_invitation_authorization_race_fixture.sql

      - name: Verify guest invitation idempotency replay is request-bound
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/guest_invitation_idempotency_scope_smoke.sql

      - name: Verify guest invitation RSVP per-link write limit
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/guest_invitation_rsvp_write_limit_smoke.sql

      - name: Verify invitation issue/revoke authorization locks against permission revocation
        run: bash scripts/db/test_guest_invitation_command_authorization_lock.sh

      - name: Verify independent worker/runtime SMTP authorization and revocation races
        run: bash scripts/db/test_guest_invitation_authorization_revocation_race.sh

      - name: Verify tenant-safe notification campaign preparation as worker
        run: psql "$WORKER_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_notification_worker_smoke.sql

      - name: Verify prepared notification snapshot as forced-RLS owner
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -c "SET ROLE eventor_owner" -f tests/database/event_notification_worker_result_smoke.sql

      - name: Verify organizer notification campaign review and confirmation as runtime
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_notification_campaign_confirmation_smoke.sql

      - name: Generate valid encrypted SMTP credentials for the immutable CI fixture
        env:
          EVENTOR_DELIVERY_CREDENTIALS_KEY: ${{ env.EVENTOR_DELIVERY_CREDENTIALS_KEY }}
        run: |
          credentials_base64="$(node apps/api/scripts/generate-ci-delivery-credentials.mjs)"
          echo "CI_DELIVERY_CREDENTIALS_CIPHERTEXT_BASE64=$credentials_base64" >> "$GITHUB_ENV"

      - name: Verify tenant-scoped SMTP configuration versioning and secret boundaries
        run: |
          psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 \
            -v ci_delivery_credentials_ciphertext_base64="$CI_DELIVERY_CREDENTIALS_CIPHERTEXT_BASE64" \
            -f tests/database/organization_delivery_configuration_smoke.sql
      - name: Run TypeScript notification worker against PostgreSQL with fake SMTP
        run: node apps/api/scripts/notification-worker-postgres-smoke.mjs

      - name: Verify SMTP delivery worker claim, retry and terminal states
        run: psql "$WORKER_URL" -X -v ON_ERROR_STOP=1 -v ci_worker_preprocessed_one=true -f tests/database/event_notification_delivery_worker_smoke.sql
      - name: Verify booking-offer email worker SQL contract as worker
        run: psql "$WORKER_URL" -X -v ON_ERROR_STOP=1 -f tests/database/booking_offer_email_worker_sql_smoke.sql

      - name: Generate encrypted booking-offer worker fixture values
        env:
          EVENTOR_CONTACT_ENCRYPTION_KEY: ${{ env.EVENTOR_CONTACT_ENCRYPTION_KEY }}
        run: node apps/api/scripts/generate-booking-offer-fixture-ciphertexts.mjs

      - name: Prepare real booking-offer email delivery fixture
        run: |
          psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 \
            -v ci_booking_offer_email_ciphertext_base64="$CI_BOOKING_OFFER_EMAIL_CIPHERTEXT_BASE64" \
            -v ci_booking_offer_capability_ciphertext_base64="$CI_BOOKING_OFFER_CAPABILITY_CIPHERTEXT_BASE64" \
            -f tests/database/booking_offer_email_worker_fixture.sql

      - name: Run booking-offer TypeScript worker against PostgreSQL with concurrent fake-SMTP workers
        env:
          EVENTOR_CONTACT_ENCRYPTION_KEY: ${{ env.EVENTOR_CONTACT_ENCRYPTION_KEY }}
          EVENTOR_DELIVERY_CREDENTIALS_KEY: ${{ env.EVENTOR_DELIVERY_CREDENTIALS_KEY }}
        run: node apps/api/scripts/booking-offer-worker-postgres-smoke.mjs

      - name: Verify booking-offer email delivery through PostgreSQL and fake SMTP
        working-directory: apps/api
        env:
          MIGRATOR_URL: ${{ env.MIGRATOR_URL }}
          WORKER_URL: ${{ env.WORKER_URL }}
        run: node --test dist/test/booking-offer-email-worker.integration.test.js

      - name: Verify real PostgreSQL login, session cookies, /me, expiry, CSRF and logout
        working-directory: apps/api
        env:
          AUTH_URL: ${{ env.AUTH_URL }}
          ADMIN_URL: ${{ env.ADMIN_URL }}
        run: node --test dist/test/session-auth-postgres.integration.test.js

      - name: Install the pinned Playwright client
        working-directory: apps/api
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Seed a synthetic staff password for browser authentication
        working-directory: apps/api
        run: |
          password_hash="$(node --input-type=module -e 'import argon2 from "argon2"; process.stdout.write(await argon2.hash("CI-only-password-2026", { type: argon2.argon2id }));')"
          psql "$AUTH_URL" -X -v ON_ERROR_STOP=1 \
            -c "UPDATE eogp.users SET password_hash = '$password_hash' WHERE email IN ('ci-a@example.invalid','ci-b@example.invalid','ci-extended-a@example.invalid');"
          test "$(psql "$AUTH_URL" -X -qAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM eogp.users WHERE email IN ('ci-a@example.invalid','ci-b@example.invalid','ci-extended-a@example.invalid') AND password_hash IS NOT NULL;")" = "3"

      - name: Start the API with isolated CI database roles
        env:
          EVENTOR_RUNTIME_DATABASE_URL: ${{ env.RUNTIME_URL }}
          EVENTOR_AUTH_DATABASE_URL: ${{ env.AUTH_URL }}
          EVENTOR_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:4173
          EVENTOR_AUTH_FINGERPRINT_KEY: U1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1M=
          EVENTOR_PUBLIC_INQUIRY_FINGERPRINT_KEY: ZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGQ=
          EVENTOR_FIELD_ENCRYPTION_KEY: dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXU=
          EVENTOR_CONTACT_ENCRYPTION_KEY: ${{ env.EVENTOR_CONTACT_ENCRYPTION_KEY }}
          EVENTOR_DELIVERY_CREDENTIALS_KEY: ${{ env.EVENTOR_DELIVERY_CREDENTIALS_KEY }}
          EVENTOR_BOOKING_CAPABILITY_KEY: JiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiY=
          HOST: 0.0.0.0
          PORT: "8080"
        run: |
          node apps/api/dist/src/main.js > /tmp/eventor-api.log 2>&1 &
          echo $! > /tmp/eventor-api.pid
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --output /dev/null http://localhost:8080/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eventor-api.log
          exit 1

      - name: Verify login, Secure cookies, session restoration, CSRF and logout in Chromium and Firefox
        env:
          EVENTOR_BROWSER_BASE_URL: http://localhost:8080
        run: bash scripts/dev/run-browser-smoke.sh session

      - name: Install and build staff web for guest browser acceptance
        working-directory: apps/staff-web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Start the built staff web preview for guest browser acceptance
        working-directory: apps/staff-web
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 --strictPort > /tmp/eventor-staff-web.log 2>&1 &
          echo $! > /tmp/eventor-staff-web.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null http://localhost:4173/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eventor-staff-web.log
          exit 1

      - name: Verify guest invitation browser flow in Chromium and Firefox
        env:
          EVENTOR_GUEST_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh guest-invitation

      - name: Seed an isolated event for organization access browser acceptance
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/organization_access_browser_fixture.sql

      - name: Verify organization access administration and retries in Chromium and Firefox
        env:
          EVENTOR_ACCESS_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh organization-access

      - name: Seed scoped provider disruption browser data
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/provider_disruption_browser_fixture.sql

      - name: Verify provider disruption notice recording and history in Chromium and Firefox
        env:
          EVENTOR_DISRUPTION_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh booking-disruption

      - name: Seed independent public cancellation bookings
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/public_booking_cancellation_browser_fixture.sql

      - name: Verify public customer cancellation and scoped status in Chromium and Firefox
        env:
          EVENTOR_CANCELLATION_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh public-booking-cancellation

      - name: Seed reviewed Registry contact merge browser access
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/registry_contact_merge_browser_fixture.sql

      - name: Verify reviewed Registry contact merges and restoration in Chromium and Firefox
        env:
          EVENTOR_CONTACT_MERGE_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh registry-contact-merge

      - name: Seed reviewed Registry source-reference merge browser access
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/registry_reference_merge_browser_fixture.sql

      - name: Verify reviewed Registry reference and contact transfers in Chromium and Firefox
        env:
          EVENTOR_REFERENCE_MERGE_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh registry-reference-merge

      - name: Verify reviewed restoration with current records and removed references in Chromium and Firefox
        env:
          EVENTOR_RESTORATION_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh registry-restoration

      - name: Seed bulk group browser access
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_guest_bulk_groups_browser_fixture.sql

      - name: Verify bulk group changes in Chromium and Firefox
        env:
          EVENTOR_BULK_GROUPS_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh event-guest-bulk-groups

      - name: Verify language persistence and permission-aware staff navigation
        env:
          EVENTOR_STAFF_SHELL_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh staff-shell

      - name: Verify persistent Registry labels in Chromium and Firefox
        env:
          EVENTOR_REGISTRY_LABELS_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh registry-labels

      - name: Seed explicit platform and multi-workspace demo accounts
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/workspace_access_browser_fixture.sql

      - name: Verify email-first login and audited workspace switching
        env:
          EVENTOR_WORKSPACE_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh workspace-access

      - name: Verify event RSVP settings in Chromium and Firefox
        env:
          EVENTOR_RSVP_SETTINGS_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh event-rsvp-settings

      - name: Verify bulk roster name reset in Chromium and Firefox
        env:
          EVENTOR_BULK_NAME_RESET_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh event-guest-bulk-name-reset

      - name: Verify reviewed Registry label transfer and restoration
        env:
          EVENTOR_LABEL_MERGE_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh registry-label-merge

      - name: Verify concurrent booking/event association creation
        run: node apps/api/scripts/booking-event-link-concurrency-smoke.mjs
      - name: Verify concurrent Registry relationship merge boundaries
        env:
          DATABASE_URL_RUNTIME: ${{ env.RUNTIME_URL }}
        run: node apps/api/scripts/registry-relationship-merge-concurrency-smoke.mjs
      - name: Seed reviewed Registry relationship merge access
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/registry_relationship_merge_browser_fixture.sql
      - name: Verify reviewed Registry relationship transfer and restoration
        env:
          EVENTOR_RELATIONSHIP_MERGE_BROWSER_BASE_URL: http://localhost:4173
        run: bash scripts/dev/run-browser-smoke.sh registry-relationship-merge
      - name: Seed Registry classification filter export access
