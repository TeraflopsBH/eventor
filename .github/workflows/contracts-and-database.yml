      - name: Prepare independent space expiry and confirmation race fixture
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/booking_expiry_confirmation_race_fixture.sql

      - name: Verify independent worker/runtime space expiry and confirmation race
