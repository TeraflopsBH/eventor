          bash scripts/db/test-ci-logical-backup-restore.sh


  systemd:
    name: systemd service unit verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify local-development entry points
        env:
          EVENTOR_DEV_POSTGRES_PASSWORD: ci-compose-validation-only
        run: |
          test "$(cat .node-version)" = "22.16.0"
          test "$(cat .nvmrc)" = "22.16.0"
          bash -n scripts/dev/*.sh
          docker compose -f compose.dev.yaml config --quiet
      - name: Set up Python for isolated database lifecycle acceptance
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Verify protected development database shutdown and restore
        run: bash scripts/dev/test-database-lifecycle.sh
      - name: Prepare referenced paths and service identities
        run: |
          sudo groupadd --system eventor-api
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin --gid eventor-api eventor-api
          sudo groupadd --system eventor-worker
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin --gid eventor-worker eventor-worker
          sudo install -d -o root -g root -m 0755 /opt/eventor/current/apps/api
          sudo install -d -o root -g root -m 0755 /opt/eventor/current/docs/operations
          sudo install -d -o root -g root -m 0755 /etc/eventor
          sudo install -o root -g root -m 0644 /dev/null /etc/eventor/api.env
          sudo install -o root -g root -m 0644 /dev/null /etc/eventor/worker.env
          sudo install -o root -g root -m 0644 /dev/null /opt/eventor/current/docs/operations/SELF_HOSTED_DEPLOYMENT_RUNBOOK.md
      - name: Verify systemd unit syntax and referenced identities
        run: |
          command -v systemd-analyze
          sudo systemd-analyze verify deploy/systemd/eventor-api.service deploy/systemd/eventor-worker.service
