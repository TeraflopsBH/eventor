name: Contracts and PostgreSQL migrations

on:
  push:
    branches:
      - feat/postgresql18-migrations-openapi-v0.3
      - fix/pr26-high-risk-integrity-review
      - feat/booking-commercial-workflow
      - feat/booking-allocation-alternatives
      - main
  pull_request:
    branches:
      - main
      - feat/postgresql18-migrations-openapi-v0.3
      - fix/pr26-high-risk-integrity-review
      - feat/booking-draft-allocation-availability-preview

permissions:
  contents: read

jobs:
  openapi:
    name: OpenAPI 3.1 contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run Eventor contract checks
        run: python scripts/validate_openapi.py docs/api/openapi.v0.3.yaml

      - name: Validate with pinned OpenAPI 3.1 validator
        run: python -m openapi_spec_validator docs/api/openapi.v0.3.yaml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"

      - name: Lint OpenAPI with pinned Redocly CLI
        run: npx --yes @redocly/cli@2.77.0 lint --config redocly.yaml docs/api/openapi.v0.3.yaml

      - name: Install API dependencies from committed lockfile
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: Audit API dependency tree for high and critical vulnerabilities
        working-directory: apps/api
        run: npm audit --audit-level=high

      - name: Generate OpenAPI TypeScript declarations, type-check and test API routes
        working-directory: apps/api
        run: npm test



  staff-web:
    name: Staff web type-check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Install staff web dependencies from committed lockfile
        working-directory: apps/staff-web
        run: npm ci --no-audit --no-fund
      - name: Audit staff web dependency tree for high and critical vulnerabilities
        working-directory: apps/staff-web
        run: npm audit --audit-level=high
      - name: Run staff web regression tests
        working-directory: apps/staff-web
        run: npm test
      - name: Type-check and build staff web
        working-directory: apps/staff-web
        run: npm run build


  postgres:
    name: PostgreSQL 18.6 migrations, RLS and concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ADMIN_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/postgres
      MIGRATOR_URL: postgresql://eventor_migrator:eventor_ci_migrator_password@127.0.0.1:5432/eventor
      RUNTIME_URL: postgresql://eventor_runtime:eventor_ci_runtime_password@127.0.0.1:5432/eventor
      AUTH_URL: postgresql://eventor_auth:eventor_ci_auth_password@127.0.0.1:5432/eventor
      WORKER_URL: postgresql://eventor_worker:eventor_ci_worker_password@127.0.0.1:5432/eventor
      DATABASE_URL: postgresql://eventor_migrator:eventor_ci_migrator_password@127.0.0.1:5432/eventor
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install PostgreSQL client and shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          bash -n scripts/db/migrate.sh
          bash -n scripts/db/test_resource_concurrency.sh
          bash -n scripts/db/test-concurrency.sh
          bash -n scripts/db/test-migrations.sh

      - name: Bootstrap least-privilege roles
        run: |
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE eventor OWNER postgres;"
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 -v database_name=eventor \
            -f scripts/db/bootstrap-roles.sql
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE eventor OWNER TO eventor_owner;"
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE eventor_migrator WITH PASSWORD 'eventor_ci_migrator_password';"
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE eventor_runtime WITH PASSWORD 'eventor_ci_runtime_password';"
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE eventor_worker WITH PASSWORD 'eventor_ci_worker_password';"
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE eventor_auth WITH PASSWORD 'eventor_ci_auth_password';"

      - name: Confirm PostgreSQL major and extension availability
        run: |
          server_version="$(psql "$MIGRATOR_URL" -X -At -v ON_ERROR_STOP=1 -c "SHOW server_version;")"
          echo "PostgreSQL server: $server_version"
          case "$server_version" in
            18.*) ;;
            *) echo "Expected PostgreSQL 18.x" >&2; exit 1 ;;
          esac

      - name: Apply checksum-verified migrations
        run: bash scripts/db/migrate.sh

      - name: Verify safe public booking form projection
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/public_booking_form_smoke.sql
      - name: Verify rate-limited, idempotent public inquiry submission
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/public_booking_inquiry_smoke.sql
      - name: Verify permissioned staff booking inquiry workflow
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/staff_booking_inquiry_smoke.sql


      - name: Seed synthetic identities through authentication role
        run: psql "$AUTH_URL" -X -v ON_ERROR_STOP=1 -f tests/database/seed_auth_test_users.sql

      - name: Run database integrity smoke tests
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/migration_smoke.sql

      - name: Verify tenant isolation as non-owner runtime role
        run: |
          psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 \
            -v organization_a=11111111-1111-4111-8111-111111111111 \
            -v organization_b=22222222-2222-4222-8222-222222222222 \
            -f tests/database/rls_smoke.sql

      - name: Verify pooled capacity with independent concurrent connections
        run: bash scripts/db/test_resource_concurrency.sh

      - name: Run extended tenant, hierarchy and interval smoke tests
        env:
          DATABASE_URL_RUNTIME: postgresql://eventor_runtime:eventor_ci_runtime_password@127.0.0.1:5432/eventor
        run: bash scripts/db/test-migrations.sh

      - name: Verify collaboration link/share transition audit
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/collaboration_lifecycle_audit_smoke.sql

      - name: Verify event cancellation and postponement after invitation delivery
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_cancellation_postponement_smoke.sql

      - name: Verify event change commands, scoped permissions and replacement schedules
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_change_command_runtime_smoke.sql

      - name: Prepare event notification worker fixture
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_notification_worker_fixture.sql

      - name: Verify tenant-safe notification campaign preparation as worker
        run: psql "$WORKER_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_notification_worker_smoke.sql

      - name: Verify prepared notification snapshot as forced-RLS owner
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -c "SET ROLE eventor_owner" -f tests/database/event_notification_worker_result_smoke.sql

      - name: Verify organizer notification campaign review and confirmation as runtime
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_notification_campaign_confirmation_smoke.sql

      - name: Verify tenant-scoped SMTP configuration versioning and secret boundaries
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/organization_delivery_configuration_smoke.sql
      - name: Verify SMTP delivery worker claim, retry and terminal states
        run: psql "$WORKER_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_notification_delivery_worker_smoke.sql

      - name: Verify delivery result under forced-RLS owner
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -c "SET ROLE eventor_owner" -f tests/database/event_notification_delivery_result_smoke.sql
      - name: Verify authenticated Resend webhook endpoint, correlation and idempotency
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/resend_delivery_webhook_smoke.sql
      - name: Verify queued campaign cancellation guard after sending starts
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_notification_campaign_cancel_smoke.sql
      - name: Verify campaign listing and privacy-safe delivery reporting
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_notification_campaign_reporting_smoke.sql
 
      - name: Verify confirmed campaign snapshot guards as owner
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/event_notification_campaign_snapshot_guard_smoke.sql

      - name: Verify PR review remediation regressions
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/review_regressions.sql

      - name: Verify committed booking-hold fixture persistence as owner
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/booking_fixture_persistence_smoke.sql

      - name: Verify permission-gated booking reservation conversion as runtime
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/booking_confirmation_runtime_smoke.sql

      - name: Prepare cancelled booking fixture for selected reservation release
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/booking_release_fixture_smoke.sql

      - name: Verify selected booking reservation release as runtime
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/booking_reservation_release_runtime_smoke.sql

      - name: Prepare terminal space reservation reuse fixture and expire overdue hold
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/booking_space_reuse_fixture_smoke.sql

      - name: Verify runtime can reserve a released, cancelled and expired space interval
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/booking_space_reuse_runtime_smoke.sql

      - name: Verify booking commercial workflow schema and runtime boundaries
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/booking_commercial_schema_smoke.sql
      - name: Verify booking form authoring commands and runtime boundaries
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/booking_form_authoring_schema_smoke.sql
      - name: Verify booking tax adjustment allocation and calculation fixtures
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/booking_tax_adjustment_calculation_smoke.sql
      - name: Verify booking offer and confirmation financial snapshot consistency
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/booking_commercial_snapshot_consistency_smoke.sql
      - name: Verify end-to-end booking offer, financial snapshots and space/resource-hold confirmation
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/booking_commercial_end_to_end_snapshot_smoke.sql

      - name: Verify delegated task projection and status command as runtime
        run: psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 -f tests/database/delegated_task_runtime_smoke.sql

      - name: Verify delegated task audit attribution in event-owner tenant
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/delegated_task_audit_smoke.sql

      - name: Verify isolated authentication database role
        run: psql "$AUTH_URL" -X -v ON_ERROR_STOP=1 -f tests/database/auth_role_smoke.sql

      - name: Verify append-only history against owner-level mutation
        run: psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 -f tests/database/append_only_smoke.sql

      - name: Report migration ledger
        run: |
          psql "$MIGRATOR_URL" -X -v ON_ERROR_STOP=1 \
            -c "SET ROLE eventor_owner; SELECT version, filename, execution_ms FROM eogp.schema_migrations ORDER BY version;"
