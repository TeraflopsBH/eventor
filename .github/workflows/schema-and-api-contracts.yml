name: schema-and-api-contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  openapi:
    name: Validate OpenAPI 3.1.1
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Validate OpenAPI specification
        run: python -m openapi_spec_validator docs/implementation-design/v0.3/eventor_openapi_v0.3.yaml
      - name: Check Eventor contract guardrails
        run: python scripts/api/check_openapi.py

  postgres:
    name: PostgreSQL 18.6 migrations and integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: eventor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eventor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Bootstrap roles, apply migrations and run database tests
        env:
          ADMIN_URL: postgresql://postgres:postgres-ci-only@127.0.0.1:5432/eventor_test?sslmode=disable
          MIGRATOR_URL: postgresql://eventor_migrator:migrator-ci-only@127.0.0.1:5432/eventor_test?sslmode=disable
          RUNTIME_URL: postgresql://eventor_runtime:runtime-ci-only@127.0.0.1:5432/eventor_test?sslmode=disable
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e ADMIN_URL \
            -e MIGRATOR_URL \
            -e RUNTIME_URL \
            postgres:18.6 \
            bash -lc '
              set -Eeuo pipefail
              psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
                -v database_name=eventor_test \
                -f scripts/db/bootstrap-roles.sql
              psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 -c "
                ALTER ROLE eventor_migrator PASSWORD '\''migrator-ci-only'\'';
                ALTER ROLE eventor_runtime PASSWORD '\''runtime-ci-only'\'';
                ALTER ROLE eventor_worker PASSWORD '\''worker-ci-only'\'';
              "
              DATABASE_URL="$MIGRATOR_URL" bash scripts/db/migrate.sh
              DATABASE_URL_RUNTIME="$RUNTIME_URL" bash scripts/db/test-migrations.sh
            '
