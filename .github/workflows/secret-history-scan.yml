name: Secret history scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan all reachable Git history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out all branches, tags and history
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: "1.25.3"
          cache: false

      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan every fetched ref and its full history
        run: gitleaks git --log-opts="--all" --redact --exit-code 1
